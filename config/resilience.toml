# Resilience configuration (wayfinder ticket 038) — retry and timeout for the
# graph's LLM calls, read by the production graph, the eval harness, and the
# eval judge alike.
#
# On their SDK defaults the nine LLM nodes never retry and never time out: a
# single 429 on any node kills a paid-for job on first contact, and a stalled
# call parks a job in `running` forever. These two numbers fix both.
#
# Unlike config/sampling.toml, these values ARE env-overridable
# (STRIDE_RETRY_ATTEMPTS, STRIDE_TIMEOUT_MS, and the optional backoff knobs
# STRIDE_RETRY_INITIAL_DELAY / _MAX_DELAY / _EXP_BASE / _JITTER). Sampling is
# pinned because temperature changes WHAT the model produces; attempts and
# timeout change only HOW HARD we try, never which answer we get, so they
# cannot move an eval score and are exactly the knobs to turn down mid-incident
# without an image rebuild.
#
# attempts and timeout_ms are one mechanism (decisions 2 and 4): the timeout
# turns a hang into an httpx.TimeoutException, which is already in the SDK's
# retry predicate, so the client-level retry then re-issues the call. The
# retryable status set and the backoff curve are left to the SDK's own
# jittered defaults — anything not listed here is deliberately unset rather
# than pinned to a number this project has never measured (ticket 038: the
# numbers are unverified against live Vertex until baselines run).

version = 1
attempts = 3
timeout_ms = 300000

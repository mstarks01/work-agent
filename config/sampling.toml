# Sampling configuration — the one file eval and production both read (ticket
# 009 decision 15). Grading a configuration you do not ship is how a suite goes
# green while production drifts, so there is no eval-only copy: per-tier tuning
# is a reviewable diff here, promoted by an eval sweep.
#
# Keyed by tier, reusing model_tiers.toml's node -> tier map: `base` runs
# extraction and repair, `strong` every framework's lane agents, its critic and
# its re-ask. A package declares its own lanes, so how many `strong` calls a job
# makes follows from the frameworks it named.
#
# Every decoding param the surface admits is listed per tier — pinned to a
# value, or left unset with a reason — so the file is the full record of what
# each tier runs on. An omitted key is not "model default by accident": the
# loader rejects an unknown key, and a deliberately-unset param is a *commented*
# line, not a silent absence.
#
# Version 4 adds `constrain_output` (see below). The field carries a default, so
# a version-3 file would have loaded unchanged — the bump is deliberate anyway,
# because the field enters the sampling fingerprint and so re-baselines every
# blessed number. A silent default would have moved that line under deployments
# that never read this file.
#
# Version 3 (wayfinder #13 / #15) is a hard cutover from version 2, forced by
# going multi-vendor. Three changes, each because a version-2 construct turned
# out to be either unportable or silently wrong:
#
#   top_k is GONE from the surface. It is absent from the signature of
#   litellm's get_optional_params, so it is the one param the build-time gate
#   provably cannot cover — LiteLLM re-injects it raw into the request body
#   after the check runs. A wrong top_k would be silent while the fingerprint
#   attested to it. It was unset on both tiers, so nothing could depend on it.
#
#   thinking is now a uniform low/medium/high enum, not an integer budget with
#   per-tier legal ranges. `reasoning_effort` reaches all three vendors, so the
#   per-class ranges version 2 mirrored dissolve rather than needing to be
#   mirrored three times over. `auto` and `off` are both dropped: `auto` raises
#   on two vendors, and `off` is worse than unportable — gemini-2.5-pro + none
#   PASSES the build-time gate as thinkingBudget: 0 and then 400s at request
#   time, and there is no per-(vendor, model) data left to catch it.
#
#   max_output_tokens is now PINNED. Anthropic derives a 5,120-8,192 cap only
#   when the caller is silent — which is exactly what version 2's file did on
#   both tiers, while its comment claimed "uncapped to 65,536". Pinning it makes
#   the request say what the file says.
#
#   A PINNED CAP IS A FAILURE MODE, not just a bound: a completion truncated at
#   the cap comes back with no text at all, so the node writes no output key and
#   the next FunctionNode fails to bind its parameter. Nothing in the response is
#   malformed, so no gate and no validator sees it. That is why the two values
#   below are sized against measured output rather than left at a round number,
#   and why binding.py checks each against its model's published ceiling.
#
# THE VALUE CHECK ON `thinking` IS OURS. reasoning_effort = "banana" passes the
# provider gate on o3, so a pydantic Literal catches it here — the same class of
# silent wrong as top_k, caught in the one place that can catch it.
#
# WHAT THE GATE DOES CHECK: every param below is run through litellm's
# get_optional_params at build time against each tier's actual (vendor, model).
# An unsupported param fails the build rather than raising mid-job after earlier
# nodes have been paid for. That check is also why `seed` can be pinned safely
# at all — it is a declared litellm param, so it is fail-closed, not silently
# dropped.
#
# WHAT NO GATE CAN CHECK: whether the provider's own schema compiler will
# accept the graph's node schemas. Anthropic rejects SystemModel's with "the
# compiled grammar is too large" -- a limit on the schema, not on structured
# output as such, and unpublished, so nothing computes it offline. That is what
# `constrain_output = false` is for, per tier. It is not derived from the vendor
# because it is not a fact about the vendor.
#
# TEMPERATURE IS UNSET ON BOTH TIERS, so each tier decodes at its model's own
# default. It is offered rather than pinned: a deployment that wants a stated
# value sets one here or by env var, and the gates below then apply to it.
#
# WHY IT IS NOT PINNED: a pinned value has to be legal on every model an
# operator may select, and no value is. Anthropic removed `temperature` from
# CLAUDE 4.7 ONWARD, so those generations reject any value at all, while
# OpenAI's reasoning families serve it only at their own default of 1. A file
# pinning 0.0 therefore chose which models this service could run, which is a
# choice that belongs to the deployment.
#
# WHAT THE GATE CANNOT CHECK, AND THE TWO RULES THAT COVER IT: litellm answers
# from the model data in the installed copy, so a model released after that copy
# is unknown to it and falls back to the provider's base config, where anything
# generally accepted passes. binding.py adds two model-keyed rules for exactly
# that case, and both are inert while temperature is unset: a tier that SETS a
# temperature fails the build on a Claude >= 4.7, and on an OpenAI reasoning
# family at any value but 1. Each keys on the model, not the vendor, because
# Vertex-hosted Claude is the same model under the same removal.
#
# `constrain_output = false` IS NOT A WORKING ANSWER to a schema the provider
# will not compile, despite reading like one. Measured live against Claude
# Sonnet 4.6: with the extraction schema suppressed the model fences its JSON,
# which ADK hands to validation unstripped, and omits required fields. Repair
# sits on the same tier, equally unconstrained, and fails the same way. See
# sampling.py.
#
# Env overrides ANALYSIS_SAMPLING_{TIER}_{PARAM} retune the OFFERED params
# (temperature, top_p, seed, thinking, max_output_tokens, constrain_output) at
# deploy time,
# validated exactly like the file value and captured by the run's fingerprint.
# Reserved params (candidate_count) and the deliberately-absent set below cannot
# be set by env at all.
#
# Deliberately absent — the contract-breaking params, never in this file and
# never overridable:
#   response_schema     ADK *raises* if it appears on the generate config
#   response_mime_type  silently discarded by ADK
#   stop_sequences      would truncate structured output mid-token
#   http_options        owned by resilience.toml, not sampling

version = 5

# SIZING THE TWO CAPS. Measured, not chosen: token counts below are o200k_base
# over artifacts in this repo, and reasoning tokens are spent against the same
# cap, so each value is the measured output plus room to think.
#
#   base   extract emits one SystemModel. Across the 12 corpus cases that is a
#          median of 1,810 tokens and a max of 2,565 — but the corpus systems are
#          small, and max_source_bytes admits 100 KiB of transcript, which
#          describes a far larger one. 16,384 is ~6x the largest measured model.
#          The weaker-evidence half of this pair: 8,192 has not been observed to
#          truncate here.
#
#   strong TWO DIFFERENT EMITTERS SHARE THIS TIER, and sizing it against the
#          smaller of them is what put 32,768 here. The critic emits one RULING
#          per draft — an ID, a verdict, a confidence, and a replacement
#          severity only where it corrected one, not the draft re-transcribed —
#          roughly 60-90 tokens per ruled threat, so a 36-draft ruling is
#          ~3,000 tokens of visible output. But the six analyze/<category>
#          agents are on this tier too, and they emit the DRAFTS: ~400 tokens
#          per threat with its grounds, which is the ~14,400-token whole-draft
#          shape the paragraph above used to cite as the critic's *old* size.
#          Those are the tier's real high-water mark, and nothing here was
#          sized against them.
#
#          64,000 rather than a round 65,536, and that is the binding
#          constraint rather than a preference: it is the FLOOR OF THE CEILING
#          SET across the models a deployment may select on this tier — Claude
#          Sonnet 4.6 publishes exactly 64,000, Gemini 2.5 Pro 65,535, and the
#          Claude Opus and GPT-5.6 families 128,000. One token more and
#          binding.py's ceiling check fails the build for any deployment
#          running Sonnet here. That is the right direction for this to break
#          in: a model with a lower ceiling now refuses to start rather than
#          truncating mid-run.
#
#          STILL NOT A MEASURED VALUE. It is the most headroom available
#          without narrowing which models the service can run, which is a
#          different claim from "enough" — reasoning tokens are spent against
#          this same cap, and on a high-effort reasoning model they are most of
#          it. What it buys is 2x the room the truncation was observed at. A
#          sweep still owes this tier a real number, in both directions.
#
# base is unchanged and cannot rise: 16,384 is exactly gpt-4o's published
# ceiling, so it is already at the floor of its own ceiling set. It has not
# been observed to truncate.

[tiers.base]
max_output_tokens = 16384 # pinned: silence means a vendor-derived cap (see above)
candidate_count = 1      # reserved Self-MoA lever; loader rejects != 1
constrain_output = true  # send this tier's node schema to the provider.
                         # Leave it true: setting it false is not currently a
                         # working configuration -- see the note above.
# temperature       unset -> the model's own default. Set a value to state one;
#                   a tier that does cannot then run Claude >= 4.7, which
#                   rejects the param, and an OpenAI reasoning family accepts
#                   only 1. Greedy decoding narrows variation; it never bought
#                   reproducibility, which rests on the served build read back
#                   from every response.
# top_p             unset -> model default; no published per-tier constant
# seed              unset -> no numeric default; buys consistency, not
#                   reproducibility, and is unavailable on Anthropic at all
# presence_penalty  unset -> effective default 0.0; valid range unverified
# frequency_penalty unset -> effective default 0.0; valid range unverified
# thinking          unset -> the model's own preset. Set "low", "medium" or
#                   "high"; the wire value each becomes is the vendor's business

[tiers.strong]
max_output_tokens = 64000 # pinned: silence means a vendor-derived cap (see above)
candidate_count = 1      # reserved Self-MoA lever; loader rejects != 1
constrain_output = true  # send this tier's node schema to the provider.
                         # Leave it true: setting it false is not currently a
                         # working configuration -- see the note above.
# temperature       unset -> the model's own default. Set a value to state one;
#                   a tier that does cannot then run Claude >= 4.7, which
#                   rejects the param, and an OpenAI reasoning family accepts
#                   only 1. Greedy decoding narrows variation; it never bought
#                   reproducibility, which rests on the served build read back
#                   from every response.
# top_p             unset -> model default; no published per-tier constant
# seed              unset -> no numeric default; buys consistency, not
#                   reproducibility, and is unavailable on Anthropic at all
# presence_penalty  unset -> effective default 0.0; valid range unverified
# frequency_penalty unset -> effective default 0.0; valid range unverified
# thinking          unset -> the model's own preset. Set "low", "medium" or
#                   "high"; the wire value each becomes is the vendor's business

# The review tier's decoding params. Its values track `strong` because the
# judgement is the same judgement: a critic reasons against the same cap the
# pass it corrects did, and giving it less room is the failure the recritic
# pairing check exists to refuse. What the tier buys is a different *model*,
# never a cheaper decode.
#
# The block is required whether or not the node map points anything at it. A
# sampling file that could omit a tier is one where moving critic/* onto
# `review` silently runs it on values nobody chose.
[tiers.review]
max_output_tokens = 64000 # pinned: silence means a vendor-derived cap (see above)
candidate_count = 1      # reserved Self-MoA lever; loader rejects != 1
constrain_output = true  # send this tier's node schema to the provider.
                         # Leave it true: setting it false is not currently a
                         # working configuration -- see the note above.
# temperature       unset -> the model's own default. Set a value to state one;
#                   a tier that does cannot then run Claude >= 4.7, which
#                   rejects the param, and an OpenAI reasoning family accepts
#                   only 1. Greedy decoding narrows variation; it never bought
#                   reproducibility, which rests on the served build read back
#                   from every response.
# top_p             unset -> model default; no published per-tier constant
# seed              unset -> no numeric default; buys consistency, not
#                   reproducibility, and is unavailable on Anthropic at all
# presence_penalty  unset -> effective default 0.0; valid range unverified
# frequency_penalty unset -> effective default 0.0; valid range unverified
# thinking          unset -> the model's own preset. Set "low", "medium" or
#                   "high"; the wire value each becomes is the vendor's business

# Model-tier configuration — source of truth for tier -> (vendor, model) and
# LLM node -> tier.
#
# The loader reads the `version` below only, and refuses every other version.
#
# NODE KEYS ARE PER FRAMEWORK: `analyze/<framework>`, `critic/<framework>` and
# `recritic/<framework>`.
#
# WHY THE FRAMEWORK AND NOT THE LANE: a lane is a framework's internal fact, and
# every lane of one framework runs the same judgement on the same tier. What an
# operator chooses between is running one framework's analysis on a cheaper tier
# than another's, and that is a knob per framework.
#
# WHY `analyze/`: `Analyst` names a human, the person who reads the report, so
# each node is named for what it does: it analyses one lane. The graph's own node
# names are a separate namespace; `TIER_NODE_BY_GRAPH_NODE` in graph.py maps
# between the two.
#
# WHY A PAIR, NOT A ROUTER STRING: `vertex_ai/gemini-2.5-pro` would have to be
# parsed back apart by all three consumers that need the vendor as a key — the
# credential mode it implies, the family-branching pinned-form rule, and the
# build-time sampling gate — and `vertex_ai/` is not one provider (LiteLLM
# dispatches `vertex_ai/claude-*` and `vertex_ai/gemini-*` to different config
# classes). The prefix lives in exactly one place: the vendor registry.
#
# TIER NAMES: `base` and `strong` are a capability axis, not a vendor's product
# line. `base` is the workhorse (extraction, repair); `strong` is judgement
# (every framework's lane agents, its critic and its re-ask). A vendor's product
# names, such as Gemini's `flash` and `pro`, would be false under a Claude or GPT
# model string. `review` is the third tier and the exception: it
# names a place rather than a capability, and exists so criticism can be moved
# off the model it checks. All three select independently, so mixed-vendor sets
# are ordinary, not a special case.
#
# PINNING is per model family and deliberately weak — an open-world denylist of
# floating words (`latest`, `preview`, `exp`, `experimental`), plus a canonical
# shape where the vendor publishes one. Claude is the family that does: from 4.6
# on, the identifier is dateless and carries the whole version
# (`claude-opus-5`, `claude-sonnet-4-6`), it is a pinned snapshot rather than an
# alias, and Vertex spells it the same way. Bedrock spells the same family
# `[<scope>.]anthropic.claude-...`, with an optional date and build tail, and
# accepts the dated forms because it serves no bare alias to confuse them with.
#
# Pinning is a proxy, not the guarantee: the reproducibility guarantee is the
# *served* build read back from every response and recorded per node execution.
# The predecessor to this rule was an allowlist of numbered Gemini builds, and
# it broke outright when Google retired them; matching a shape rather than
# enumerating builds is what keeps the Claude half from repeating that.
#
# ENV OVERRIDES are two vars per tier: ANALYSIS_MODEL_{BASE,STRONG,REVIEW}_VENDOR and
# _MODEL, plus ANALYSIS_MODEL_CREDENTIALS_{VENDOR}, ANALYSIS_MODEL_CHARGES_{VENDOR}
# and ANALYSIS_MODEL_UPSTREAMS_{VENDOR} for the three vendor tables below. `_MODEL` alone is the ops case (retune on a deployed revision without
# an image rebuild). `_VENDOR` alone is a build-time error — a cross-vendor pair
# like anthropic + gemini-2.5-pro passes every downstream check and would die on
# node one of a paid-for job. Any unrecognised ANALYSIS_MODEL_* var also raises,
# so a deployment still carrying v2's ANALYSIS_MODEL_FLASH fails loudly instead of
# being silently ignored.
#
# NOTHING IS SELECTED BY DEFAULT, and that is the point. Earlier versions of
# this file shipped two Gemini models on Vertex, which made "no privileged
# default" true of the *mechanism* while the values said otherwise — the vendor
# you got by doing nothing was Google's. Both tier tables are now absent, so a
# run that has not chosen stops and says so rather than reaching a vendor nobody
# picked. Every vendor is reached through one adapter and they differ only in
# the credential mode each implies; none is cheaper to select than the others.

version = 9

# HOW FAR THE CRITIC MUST SIT FROM THE ANALYSIS IT CHECKS. Required, and there
# is deliberately no default: inheriting `shared` is how an install that meant
# to review itself independently ends up not doing so, and reporting nothing
# unusual about it.
#
#   "shared"            criticism may run on the very model it checks. What the
#                       shipped node map below does. A critic on one model still
#                       catches inconsistency and unsupported claims, and it
#                       costs one tier rather than two.
#   "distinct_model"    every framework's critic must run a different model
#                       from its own analysis. Removes a single build's blind
#                       spots; leaves the provider's. Compared by the
#                       identifier with any gateway segment stripped, so
#                       "openai/gpt-5.6" through an aggregator and "gpt-5.6"
#                       direct are one model and not two.
#   "distinct_provider" the serving organisation must differ too. Removes a
#                       provider's blind spots, at the cost of a second
#                       credential and quota. A gateway route cannot satisfy
#                       it: an aggregator picks the upstream per call, so
#                       nothing here can say the two ran on different ones,
#                       and it is a load error rather than an assumption.
#
# NONE OF THESE MAKES A REVIEW MORE ACCURATE. Independence bounds *correlated*
# failure. It does not make a second opinion a better one, and no measurement in
# this repository says a second provider finds more. Choose it as a risk control.
#
# Asking for more than "shared" while leaving critic/* on `strong` beside
# analyze/* is a load-time error naming the framework, not a warning: a
# deployment that asked for an independent reviewer and did not get one has a
# configuration to fix, not a run to annotate.
review_independence = "shared"

# CHOOSE A VENDOR AND MODEL FOR EACH TIER. Fill in the template below, or set
# ANALYSIS_MODEL_{BASE,STRONG,REVIEW}_VENDOR together with the matching _MODEL —
# the two halves must move together, since a vendor without its model is not a
# usable selection. Model identifiers must be pinned: the identifier may not
# carry `latest`, `preview`, `exp` or `experimental` as a whole word, and Claude
# takes its dateless 4.6+ ID. docs/First-Run.md step 2 walks
# through each vendor's credentials; docs/Configuration.md has the rules.
#
# [tiers.base]
# vendor = "<vertex|anthropic|openai|bedrock|gemini|openrouter>"
# model = "<model>"
#
# [tiers.strong]
# vendor = "<vertex|anthropic|openai|bedrock|gemini|openrouter>"
# model = "<model>"
#
# [tiers.review]
# vendor = "<vertex|anthropic|openai|bedrock|gemini|openrouter>"
# model = "<model>"
#
# A VENDOR THAT ALLOWS MORE THAN ONE CREDENTIAL MODE declares which one this
# deployment uses, here or in ANALYSIS_MODEL_CREDENTIALS_{VENDOR}. Bedrock is
# the one that does, and a missing declaration is a load error naming it:
#
# [credentials]
# bedrock = "<api_key|iam>"
#
# A key for a vendor that allows a single mode is also an error, because there
# is nothing to choose.
#
# A VENDOR THAT STATES WHAT IT CHARGED declares the arrangement this deployment
# runs under, here or in ANALYSIS_MODEL_CHARGES_{VENDOR}. OpenRouter is the one
# that does, and a missing declaration is a load error naming it:
#
# [charges]
# openrouter = "<direct|own_upstream_key>"
#
#   "direct"            this account pays OpenRouter for the whole call, so the
#                       charge it reports is what the call cost, and the report
#                       records it beside the token counts.
#   "own_upstream_key"  OpenRouter routes the call under a provider key of the
#                       operator's own. It charges a routing fee of about a
#                       twentieth of its list price, the upstream provider
#                       charges the operator directly, and the reported figure
#                       is the fee alone. The report records no charge there,
#                       because a figure that covers a twentieth of a call is
#                       worse than no figure on a record somebody reads as a
#                       cost.
#
# A key for a vendor that reports no charge is an error, as is one for a vendor
# with a single arrangement.
#
# A VENDOR THAT ROUTES TO MORE THAN ONE UPSTREAM may be pinned to the ones a
# request may reach, here or in ANALYSIS_MODEL_UPSTREAMS_{VENDOR} as a
# comma-separated list. Optional: an analysis is an analysis whichever upstream
# answers. A Baseline is named after the one upstream the record says served
# it, so a sweep meant to be published pins one. The slugs are the gateway's
# own, and an endpoint variant takes a tag: "openai/flex". A key for a vendor
# that routes to one provider is a load error, because there is nothing to pin.
#
# [upstreams]
# openrouter = ["openai"]
#
# `review` is NOT required while `review_independence = "shared"` leaves the
# node map pointing criticism at `strong`, because nothing runs on it and the
# loader binds no adapter for a tier nothing is bound to. Selecting a pair for
# an empty place is a choice with no consequence, and a repeat of the `strong`
# pair is a choice that says nothing.
#
# The day somebody moves critic/* onto `review` is still the wrong day to find
# out no model was chosen for it, and that day is an edit to the [nodes] map
# below. The loader reads this file on that edit, so it refuses then, with the
# same message it would have given at a first run.
#
# A TEMPLATE RATHER THAN A WORKED PAIR, and that is the same decision as the
# empty tier tables above. One worked pair would be the one example a reader
# copies, which makes it a privileged default. The vendors below are alphabetical, equally
# detailed, and every one of them is a real pair the offline conformance suite
# profiles (src/analysis_service/conformance.py):
#
#   anthropic   base "claude-sonnet-5"       strong "claude-opus-5-5"
#   bedrock     base "global.anthropic.claude-sonnet-4-6"
#               strong "global.anthropic.claude-opus-5-5"
#   gemini      base "gemini-2.5-flash"      strong "gemini-2.5-pro"
#   openai      base "gpt-4o-2024-08-06"     strong "gpt-5.6-sol"
#   openrouter  base "anthropic/claude-sonnet-5"
#               strong "anthropic/claude-opus-5.5"
#   vertex      base "gemini-2.5-flash"      strong "gemini-2.5-pro"
#
# `gemini` and `vertex` name the same models. They are two vendors because they
# are two routes: the Gemini Developer API takes an API key, Vertex takes a
# platform identity, and LiteLLM dispatches `gemini/` and `vertex_ai/` to two
# providers. A tier may select either, and a deployment may select both.
#
# `openrouter` is an aggregator, so its model identifier carries a provider of
# its own and a model name has a slash in it. Write the whole slug as the model.
# It spells the Claude minor version with a dot, so a tier row copied off the
# `anthropic` row is refused with a hint rather than accepted.
#
# `review` needs a pair only once something sits on it. Under the shipped
# `review_independence = "shared"` nothing does, so a deployment that wants the
# shipped arrangement names these two and stops; a deployment that wants an
# independent critic moves critic/* onto `review` in [nodes] and names a third
# pair, and the loader asks for it at that edit.
#
# The Anthropic pin is 4.6 on both of the tiers above because that is the pair
# this project
# has profiled, and it is free choice: no generation is refused here, and a
# newer Claude is a one-line edit. What a generation still decides is which
# params it accepts — 4.7 onward rejects `temperature`, which the shipped
# sampling does not set — so read config/sampling.toml before stating one. Run
# `uv run python -m analysis_service.conformance` to see what each pair supports
# before choosing.
#
# The three tiers select independently, so a mixed set — a cheap workhorse from
# one vendor, judgement from another, review from a third — is ordinary rather
# than a special case.
#
# BEDROCK NEEDS ITS CLIENT LIBRARY IN THE IMAGE: `pip install
# analysis-service[bedrock]`. The build refuses to bind a Bedrock tier without
# it, and names the extra.

[nodes]
extract = "base"
repair = "base"
# The assertion pass reads the same sources extraction read and writes rows
# rather than judgements, so it is transcription on the workhorse tier.
assert = "base"
# The capability reader also reads the sources and writes rows the gate checks,
# so it is transcription on the workhorse tier too. A job runs it only where a
# selected framework reads capabilities and ANALYSIS_CAPABILITY_READER is on,
# but every install names its tier, as it does for the assertion pass.
capabilities = "base"
# Three keys per framework. Every lane of one framework runs the same judgement
# on the same tier, so this is one knob per framework rather than one per lane —
# an operator choosing to run one framework cheaper than another is the choice
# that has a purpose, and six keys that always held one value had no reader.
#
# THE KEYS ARE REQUIRED IN EVERY INSTALL, including one whose `carried` list
# names a single framework. `LLM_NODES` derives from `FrameworkName`, which names
# what this build can spell rather than what this install runs, so a file missing
# a framework's three keys fails `_check_complete` and the message names them.
# That message is the fix. The version does not move for a key added under the
# same schema: adding a framework is a data edit here.
#
# ASVS runs 17 lanes against STRIDE's 6, so this is the knob that decides what
# the extra lanes cost. The two frameworks select independently.
"analyze/asvs" = "strong"
"critic/asvs" = "strong"
"recritic/asvs" = "strong"
"analyze/stride" = "strong"
"critic/stride" = "strong"
# The bounded critic re-ask (ticket 038): same judgement as the critic, so
# always the same tier. The loader now *checks* the pairing rather than trusting
# this comment — at two keys a comment holds, at 2N keys it drifts, and a re-ask
# on a cheaper model than the pass it corrects is what the comment warned about.
"recritic/stride" = "strong"

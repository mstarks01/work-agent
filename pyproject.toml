[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stride-service"
version = "0.1.0"
description = "Agentic STRIDE threat-modeling service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "google-adk==2.5.0",
    "pydantic>=2.7",
    "pyjwt[crypto]>=2.9",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.16.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/stride_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The eval harness (evals/harness) is imported by the offline eval tests but
# is deliberately not part of the wheel — nothing under evals/ ships in the
# production image (wayfinder ticket 009 decision 14).
pythonpath = ["."]

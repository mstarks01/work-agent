[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stride-service"
version = "0.1.0"
description = "Agentic STRIDE threat-modeling service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "google-adk==2.5.0",
    # Exact pin, on the google-adk precedent. litellm is not just the adapter:
    # `litellm.utils.get_optional_params` IS the build-time supported-param
    # gate, and it is not a documented public API, so a version bump must
    # re-run the probe in tests/test_model_gate.py rather than be taken as a
    # routine dependency update.
    "litellm==1.93.0",
    "pydantic>=2.7",
    "pyjwt[crypto]>=2.9",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.18",
    "pip-audit>=2.9",
    "pytest>=8",
    "ruff>=0.16.0",
]
# The lite first-run web app's server (#32). A dependency-group, not an extra
# and not a wheel dependency: `webapp/main.py` is a standalone driver script
# outside `src/stride_service`, same as `examples/`, so no `pip install` path
# names it — there is no console script and no `[web]` extra. That is
# independent of what the wheel bundles for the *engine* (see force-include
# below): the app itself simply isn't packaged. Groups never enter the built
# distribution either, so the integrator at route step 5 inherits none of
# this — their dependency surface stays whatever `src/stride_service` needs.
web = [
    "uvicorn>=0.30",
]

[tool.uv]
# Both groups on by default, so `uv sync` (route step 1) leaves route step 3 a
# bare `uv run python webapp/main.py` with no install incantation in between.
default-groups = ["dev", "web"]

[tool.hatch.build.targets.wheel]
# `src/stride_service/py.typed` rides along inside the package, which is what
# makes the annotations visible to an integrator's own checker -- without the
# marker, PEP 561 says to treat an installed package as untyped however
# thoroughly it is annotated.
packages = ["src/stride_service"]

[tool.hatch.build.targets.wheel.force-include]
# The other half of what a run needs, alongside the engine code `packages`
# already covers. Bundled under the package namespace rather than left at the
# wheel root so `pip install stride-service` (or `stride-service[web]`, which
# is still meaningless per the comment above) resolves everything from one
# installed location with no additional fetch. The source of truth stays these
# top-level directories -- editing a prompt or a config default still means
# editing the file here, not something under `_bundled/`, which only exists in
# a built wheel. See deployment.py's DEFAULT_* resolution for the read side.
"prompts" = "stride_service/_bundled/prompts"
"domains" = "stride_service/_bundled/domains"
"frameworks" = "stride_service/_bundled/frameworks"
"config" = "stride_service/_bundled/config"

[tool.ruff]
# Stated rather than inferred from `requires-python`, so raising the floor to
# 3.12 is a deliberate lint decision rather than a side effect. Rule selection
# is deliberately ruff's default set: it is a curated cross-family subset, so
# naming families here would enable far more than it pins. What holds it stable
# is the exact `ruff` pin in uv.lock, which CI installs with `uv sync --locked`.
target-version = "py311"

[tool.mypy]
# Every Python file in the repository, not just the shipped package. The eval
# harness and the corpus lints are where a `Literal` vocabulary is most often
# re-spelled as a bare `str`, and the tests are what pin the Protocol seams --
# checking only `src/` would leave the checker blind to exactly the drift it
# was added for.
files = ["src", "tests", "evals", "examples", "webapp"]
# `src` on the path, so `src/stride_service/api.py` is the module
# `stride_service.api` and not also `src.stride_service.api`. With the layouts
# outside it -- `evals/` and `examples/` have no `__init__.py` -- that needs
# each directory in `files` treated as its own package root.
mypy_path = "src"
explicit_package_bases = true
# The `requires-python` floor rather than the version CI happens to install, so
# a 3.12-only construct fails here instead of at an integrator's 3.11.
python_version = "3.11"
# Rule selection is mypy's default, on the same reasoning as ruff's above: the
# exact pin in uv.lock is what holds it stable. Strict mode is a separate
# decision, not a free tightening -- it would demand annotations on every
# function in the repository, which is a change to the code, not to the gate.
#
# One addition, because a suppression that has stopped applying is worse than
# none: it reads as a known-unfixable spot long after the checker or the
# dependency it worked around has moved on.
warn_unused_ignores = true

[tool.ruff.format]
# Hand-labelled data table: one tuple per row is the editing and grep unit, and
# 88-column wrapping turns each of its ~400 rows into six lines. Only formatting
# is opted out here — `ruff check` still covers the file.
exclude = ["evals/judge_calibration/build_pairs.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The eval harness (evals/harness) is imported by the offline eval tests but
# is deliberately not part of the wheel — nothing under evals/ ships in the
# production image (wayfinder ticket 009 decision 14).
pythonpath = ["."]

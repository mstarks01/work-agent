[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stride-service"
version = "0.1.0"
description = "Agentic STRIDE threat-modeling service"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/stride_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]

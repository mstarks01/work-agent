      { "id": "flow:background-worker-to-database:read-write-records", "name": "read write records", "source": "process:background-worker", "destination": "store:database", "protocol": "unknown", "authentication": "unknown", "encryption_in_transit": "unknown",
        "source_excerpt": "The background worker reads and writes the database.", "source_label": "System description", "source_speaker": "" },
      { "id": "flow:web-application-to-web-application-config:read-configuration", "name": "read configuration", "source": "process:web-application", "destination": "store:web-application-config", "protocol": "unknown", "authentication": "unknown", "encryption_in_transit": "unknown",
        "source_excerpt": "the web application has a web application config", "source_label": "System description", "source_speaker": "" }
    ]
  }
}
</script>

<script>
  const R = JSON.parse(document.getElementById("report").textContent);
  const $ = (id) => document.getElementById(id);
  const root = $("root");

  // #78 decision 1: untrusted text reaches the DOM as textContent or DOM nodes, never innerHTML.
  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;   // textContent, always
    return n;
  };
  const code = (t) => el("code", null, t);

  const SEV = { critical: ["Critical","--sev-critical"], high: ["High","--sev-high"],
                medium: ["Medium","--sev-medium"], low: ["Low","--sev-low"] };
  const SEV_ORDER = ["critical","high","medium","low"];
  const VERDICT = { confirmed: ["Confirmed","✓"], "needs-info": ["Needs info","?"], rejected: ["Rejected","✕"] };
  const svar = (l) => `var(${SEV[l][1]})`;
  const KIND = {
    "quote": ["Quoted from the submission", "g-quote"],
    "unknown-attribute": ["Unstated in the submission", "g-unknown"],
    "derived-fact": ["Derived from the model", "g-derived"],
  };
  const SRC_KIND = Object.fromEntries(R.input.sources.map(s => [s.label, s.kind]));
  const CROSSING = Object.fromEntries(R.boundary_crossings.map(c => [c.flow_id, c]));
  const ELEMENTS = Object.fromEntries(
    [...R.system_model.external_entities, ...R.system_model.processes,
     ...R.system_model.data_stores, ...R.system_model.data_flows].map(e => [e.id, e]));

  const unverified = (tid, i) =>
    (R.unverified_grounds || []).find(u => u.threat_id === tid && u.index === i);

  const VARIANTS = {
    A: "Evidence rail",
    B: "Evidence as the lede",
    C: "Margin citations",
  };
  const variant = (new URLSearchParams(location.search).get("variant") || "A").toUpperCase();
  const V = VARIANTS[variant] ? variant : "A";
  root.classList.add(V);

  /* ---------------- shared pieces ---------------- */

  function unverifiedTag(u) {
    const tag = el("span", "g-unverified", "⚠ unverified");
    tag.title = u.reason;                       // property assignment, no markup context
    return tag;
  }

  function quoteCite(g, u) {
    const cite = el("div", "g-cite");
    // DECIDED (#84): an unverified quote states the failure in words on the cite
    // line — no tooltip, which keyboard and touch cannot reach.
    if (u && V === "A") {
      cite.append(el("span", "g-unverified", "⚠ not found in " + g.source_label));
      return cite;
    }
    cite.append(el("span", null, "—"), code(g.source_label));
    const kind = SRC_KIND[g.source_label];
    if (kind) cite.append(el("span", null, kind));
    if (u) cite.append(unverifiedTag(u));
    return cite;
  }

  // Variant A + B use the same long-quote treatment: clamp to 3 lines, expand in place.
  // DECIDED (#84): an unverified quote loses its quotation marks — they assert a
  // verbatim span the service could not find.
  function clampedQuote(text, unverified) {
    const q = el("blockquote", "g-text clamp", unverified ? text : "“" + text + "”");
    const wrap = el("div");
    wrap.append(q);
    if (text.length > 220) {
      const btn = el("button", "g-more", "Show full quote");
      btn.type = "button";
      btn.addEventListener("click", () => {
        const open = q.classList.toggle("clamp");
        btn.textContent = open ? "Show full quote" : "Show less";
      });
      wrap.append(btn);
    }
    return wrap;
  }

  function elementName(id) {
    const e = ELEMENTS[id];
    return e ? e.name : id;
  }

  /* ---------------- Variant A — evidence rail ---------------- */

  function groundsA(t) {
    const box = el("div", "grounds");
    box.append(el("div", "lbl", "Grounds — why this was raised"));
    t.grounds.forEach((g, i) => {
      const row = el("div", "g-row g-" + g.kind);
      row.append(el("div", "g-bar"));
      const body = el("div");
      const kindLine = el("div", "g-kind " + KIND[g.kind][1] + "-kind", KIND[g.kind][0]);
      body.append(kindLine);
      if (g.kind === "quote") {
        const u = unverified(t.id, i);
        body.append(clampedQuote(g.text, !!u), quoteCite(g, u));
      } else if (g.kind === "unknown-attribute") {
        const line = el("div", "g-text");
        line.append(code(g.attribute), el("span", null, " is unstated for "), code(g.element_id));
        body.append(line);
        body.append(el("div", "g-cite", elementName(g.element_id)));
      } else {
        const c = CROSSING[g.flow_id];
        const line = el("div", "g-text");
        line.append(el("span", null, "crossing on "), code(g.flow_id));
        body.append(line);
        const cite = el("div", "g-cite");
        if (c) { cite.append(code(c.source_zone), el("span", null, "→"), code(c.destination_zone)); }
        body.append(cite);
      }
      row.append(body);
      box.append(row);
    });
    return box;
  }

  /* ---------------- Variant B — evidence as the lede ---------------- */

  function groundsB(t) {
    const lede = el("div", "lede");
    lede.append(el("div", "hdr", "What in your input produced this"));
    t.grounds.forEach((g, i) => {
      const row = el("div", "g-row");
      if (g.kind === "quote") {
        row.append(clampedQuote(g.text), quoteCite(g, unverified(t.id, i)));
      } else if (g.kind === "unknown-attribute") {
        const line = el("div", "g-inline");
        line.append(el("span", "g-kind g-unknown-kind", "unstated"), code(g.attribute),
                    el("span", null, "on"), code(g.element_id));
        row.append(line);
      } else {
        const c = CROSSING[g.flow_id];
        const line = el("div", "g-inline");
        line.append(el("span", "g-kind g-derived-kind", "derived"),
                    el("span", null, "trust-boundary crossing on"), code(g.flow_id));
        row.append(line);
        if (c) {
          const sub = el("div", "g-cite");
          sub.append(code(c.source_zone), el("span", null, "→"), code(c.destination_zone));
          row.append(sub);
        }
      }
      lede.append(row);
    });
    return lede;
  }

  /* ---------------- Variant C — margin citations ---------------- */

  function groundsC(t) {
    const col = el("div", "margin");
    col.append(el("div", "hdr", "Grounds"));
    t.grounds.forEach((g, i) => {
      const c = el("div", "g-card g-" + g.kind);
      c.append(el("div", "g-kind " + KIND[g.kind][1] + "-kind", KIND[g.kind][0]));
      if (g.kind === "quote") {
        const short = g.text.length > 160 ? g.text.slice(0, 160) + "…" : g.text;
        const q = el("div", "g-text", "“" + short + "”");
        c.append(q);
        if (g.text.length > 160) {
          const btn = el("button", "g-more", "Expand");
          btn.type = "button";
          let open = false;
          btn.addEventListener("click", () => {
            open = !open;
            q.textContent = "“" + (open ? g.text : short) + "”";
            btn.textContent = open ? "Collapse" : "Expand";
          });
          c.append(btn);
        }
        c.append(quoteCite(g, unverified(t.id, i)));
      } else if (g.kind === "unknown-attribute") {
        const line = el("div", "g-text");
        line.append(code(g.attribute));
        c.append(line, el("div", "g-cite", elementName(g.element_id)));
      } else {
        const cr = CROSSING[g.flow_id];
        c.append(el("div", "g-text", elementName(g.flow_id)));
        const cite = el("div", "g-cite");
        if (cr) cite.append(code(cr.source_zone), el("span", null, "→"), code(cr.destination_zone));
        c.append(cite);
      }
      col.append(c);
    });
    return col;
  }

  /* ---------------- the card ---------------- */

  function threatCard(t, rejected) {
    const card = el("div", "card" + (rejected ? " rejected" : ""));
    card.style.borderLeftColor = svar(t.severity.level);
    const main = V === "C" ? el("div", "main") : card;

    if (V === "B") main.append(groundsB(t));

    const head = el("div", "card-head");
    head.append(el("h3", null, t.title), el("span", "tid", t.id));
    main.append(head);
    main.append(el("div", "cat", t.category));

    const badges = el("div", "badges");
    const sev = el("span", "chip");
    const sw = el("span", "swatch"); sw.style.background = svar(t.severity.level);
    sev.append(sw, el("span", null, SEV[t.severity.level][0]));
    sev.title = `likelihood ${t.severity.likelihood} × impact ${t.severity.impact}`;
    const [vlabel, vglyph] = VERDICT[t.verdict.status];
    badges.append(sev, el("span", "chip verdict", `${vglyph} ${vlabel}`),
                  el("span", "chip confidence", `confidence: ${t.confidence}`));
    main.append(badges);

    main.append(el("div", "desc", t.description));

    const rat = el("div", "field");
    rat.append(el("span", "lbl", "Severity rationale"), el("div", null, t.severity.justification));
    main.append(rat);

    const refs = el("div", "field refs");
    refs.append(el("span", "lbl", "Affected elements"));
    const rl = el("div");
    t.affected_element_ids.forEach(r => rl.append(code(r)));
    refs.append(rl);
    main.append(refs);

    if (V === "A") main.append(groundsA(t));

    if (t.verdict.status === "needs-info") {
      const u = el("div", "unknown");
      u.append(el("b", null, "Needs info. "), el("span", null, t.verdict.reason + " Unknown: "));
      t.verdict.related_unknowns.forEach(r => {
        u.append(code(r.element_id), el("span", null, " → "), code(r.attribute));
      });
      main.append(u);
    }
    if (t.verdict.status === "rejected") {
      const r = el("div", "field");
      r.append(el("span", "lbl", "Reason dismissed"), el("div", null, t.verdict.reason));
      main.append(r);
    }
    if (t.mitigations && t.mitigations.length) {
      const wrap = el("div", "field");
      wrap.append(el("div", "lbl", "Mitigations"));
      const list = el("ul", "mits");
      t.mitigations.forEach(m => list.append(el("li", null, m.summary)));
      wrap.append(list);
      main.append(wrap);
    }

    if (V === "C") { card.append(main, groundsC(t)); }
    return card;
  }

  /* ---------------- page ---------------- */

  $("sysname").textContent = R.input.system_name;
  $("jobmeta").append(el("span", null, `Job ${R.job.id} · ${R.job.status} · schema ${R.schema_version}`));

  // Variant B also surfaces the source list up top — the citation keys quotes resolve against.
  if (V === "B") {
    const h = el("h2", null, "Sources");
    const box = el("div", "sources");
    R.input.sources.forEach(s => {
      const c = el("div", "src");
      c.append(el("b", null, s.label), el("span", null, ` · ${s.kind} · `), code(s.sha256.slice(0, 12) + "…"));
      box.append(c);
    });
    $("sourcespanel").append(h, box);
  }

  [[R.summary.threat_count, "Actionable threats"], [R.summary.needs_info_count, "Needs info"],
   [R.summary.rejected_count, "Rejected"], [R.summary.elements_analyzed, "Elements analysed"]]
    .forEach(([n, k]) => {
      const t = el("div", "tile");
      t.append(el("div", "n", String(n)), el("div", "k", k));
      $("tiles").append(t);
    });

  [...R.threats].sort((a, b) => SEV_ORDER.indexOf(a.severity.level) - SEV_ORDER.indexOf(b.severity.level))
    .forEach(t => $("threats").append(threatCard(t, false)));
  R.rejected_threats.forEach(t => $("rejected").append(threatCard(t, true)));

  // Element table. Variant C is the only one that carries element provenance here;
  // A and B keep all attribution on findings.
  const cols = ["Type", "ID", "Name", "Trust zone", "Key attributes"];
  if (V === "C") cols.push("From the source");
  cols.forEach(c => $("elhead").append(el("th", null, c)));
  const attrs = {
    "external-entity": e => `kind: ${e.kind}`,
    "process": e => `${e.technology} · exposure: ${e.exposure}`,
    "data-store": e => `${e.technology} · ${e.data_classification} · at rest: ${e.encryption_at_rest}`,
    "data-flow": e => `${e.protocol} · auth: ${e.authentication} · in transit: ${e.encryption_in_transit}`,
  };
  const rows = [
    ...R.system_model.external_entities.map(e => ["external-entity", e]),
    ...R.system_model.processes.map(e => ["process", e]),
    ...R.system_model.data_stores.map(e => ["data-store", e]),
    ...R.system_model.data_flows.map(e => ["data-flow", e]),
  ];
  const tb = $("elements").querySelector("tbody");
  rows.forEach(([type, e]) => {
    const tr = el("tr");
    const zone = e.trust_zone || (e.source + " → " + e.destination);
    const cell = (node) => { const td = el("td"); td.append(node); return td; };
    [el("td", null, type), cell(code(e.id)), el("td", null, e.name),
     cell(code(zone)), el("td", null, attrs[type](e))].forEach(td => tr.append(td));
    if (V === "C") {
      const td = el("td", "excerpt-col");
      td.append(el("div", null, "“" + e.source_excerpt + "”"));
      const cite = el("div", "g-cite");
      cite.append(code(e.source_label));
      if (e.source_speaker) cite.append(el("span", "g-speaker", e.source_speaker));
      td.append(cite);
      tr.append(td);
    }
    tb.append(tr);
  });
  if (V === "C") {
    $("elcaption").append(el("p", "caption",
      "“From the source” is why this element was extracted — not evidence for any finding above."));
  }

  $("themebtn").addEventListener("click", () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const dark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
  });

  /* ---------------- prototype switcher (throwaway chrome) ---------------- */
  const keys = Object.keys(VARIANTS);
  const go = (d) => {
    const next = keys[(keys.indexOf(V) + d + keys.length) % keys.length];
    location.search = "?variant=" + next;
  };
  const bar = el("div", "switcher");
  const prev = el("button", null, "←"); prev.type = "button"; prev.addEventListener("click", () => go(-1));
  const next = el("button", null, "→"); next.type = "button"; next.addEventListener("click", () => go(1));
  const lab = el("div", "lab", `${V} — ${VARIANTS[V]}`);
  bar.append(el("span", "tag", "prototype"), prev, lab, next);
  document.body.append(bar);
  document.addEventListener("keydown", (ev) => {
    const t = ev.target;
    if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
    if (ev.key === "ArrowLeft") go(-1);
    if (ev.key === "ArrowRight") go(1);
  });
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STRIDE Report — Orders Service</title>
<style nonce="__CSP_NONCE__">
  /* Palette roles (dataviz reference instance). Status hues are fixed, never themed. */
  .viz-root {
    color-scheme: light;
    --plane:        #f9f9f7;
    --surface:      #fcfcfb;
    --surface-2:    #f2f2ee;
    --ink:          #0b0b0b;
    --ink-2:        #52514e;
    --muted:        #898781;
    --border:       rgba(11,11,11,0.10);
    --hairline:     #e1e0d9;
    /* severity = status palette: critical / high(serious) / medium(warning) / low(good) */
    --sev-critical: #d03b3b;
    --sev-high:     #ec835a;
    --sev-medium:   #fab219;
    --sev-low:      #0ca30c;
    /* Grounds kinds. Deliberately outside the severity ramp above: nothing in
       the grounds block is a severity signal, and a reader who has just learned
       red-to-green means severity must not read these as a fourth band. */
    --g-quote:      #3c6ecb;
    --g-unknown:    #7a52c4;
    --g-derived:    #1f8a86;
    --tint:         color-mix(in srgb, var(--surface) 88%, transparent);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      color-scheme: dark;
      --plane:    #0d0d0d;
      --surface:  #1a1a19;
      --surface-2:#242422;
      --ink:      #ffffff;
      --ink-2:    #c3c2b7;
      --muted:    #898781;
      --border:   rgba(255,255,255,0.10);
      --hairline: #2c2c2a;
      --g-quote:  #7ea6ee;
      --g-unknown:#ac8ce8;
      --g-derived:#49b6b1;
    }
  }
  :root[data-theme="dark"] .viz-root {
    color-scheme: dark;
    --plane:#0d0d0d; --surface:#1a1a19; --surface-2:#242422;
    --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781; --border:rgba(255,255,255,0.10); --hairline:#2c2c2a;
    --g-quote:#7ea6ee; --g-unknown:#ac8ce8; --g-derived:#49b6b1;
  }

  * { box-sizing: border-box; }
  body { margin: 0; }
  .viz-root {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--plane); color: var(--ink);
    line-height: 1.5; padding: 32px 20px 64px;
  }
  .wrap { max-width: 940px; margin: 0 auto; }

  .topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em;
       color: var(--muted); margin: 40px 0 14px; font-weight: 600; }
  .meta { color: var(--ink-2); font-size: 0.85rem; }
  .meta code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  .toggle { border: 1px solid var(--border); background: var(--surface); color: var(--ink-2);
    border-radius: 8px; padding: 6px 12px; font: inherit; font-size: 0.8rem; cursor: pointer; }
  .toggle:hover { color: var(--ink); }

  .disclaimer { margin-top: 16px; padding: 10px 14px; border-radius: 10px;
    background: var(--tint); border: 1px solid var(--border); color: var(--ink-2); font-size: 0.85rem;
    display: flex; gap: 8px; align-items: center; }
  .disclaimer .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--sev-medium); flex: none; }

  /* stat tiles */
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .tile .n { font-size: 1.9rem; font-weight: 650; letter-spacing: -0.02em; }
  .tile .k { color: var(--muted); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; margin-top: 2px; }
  @media (max-width: 620px) { .tiles { grid-template-columns: repeat(2, 1fr); } }

  /* severity mix bar */
  .mix { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--surface-2); gap: 2px; }
  .mix span { display: block; }
  .mixlegend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; font-size: 0.82rem; color: var(--ink-2); }
  .mixlegend .swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; margin-right: 6px; vertical-align: middle; }

  /* threat cards */
  .card { background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--muted);
    border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; }
  .card.rejected { opacity: 0.9; border-left-color: var(--muted); background: var(--surface-2); }
  .card-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .card h3 { font-size: 1.02rem; margin: 0; flex: 1 1 260px; }
  .tid { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); font-size: 0.82rem; }
  .cat { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-2); }
  .desc { margin: 10px 0 12px; color: var(--ink-2); font-size: 0.92rem; }

  .badges { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 0.75rem; font-weight: 600;
    padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border); white-space: nowrap; }
  .chip .swatch { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .chip.verdict { color: var(--ink-2); background: var(--surface); }
  .chip.confidence { color: var(--muted); background: transparent; border-color: var(--hairline); }

  .field { font-size: 0.85rem; margin-top: 8px; }
  .field .lbl { color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; font-size: 0.68rem; }
  .refs code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.8rem;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 1px 6px; margin-right: 6px; }
  ul.mits { margin: 6px 0 0; padding-left: 18px; font-size: 0.88rem; color: var(--ink-2); }

  /* grounds rail — why the finding was raised, under the analysis */
  .grounds { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--hairline); }
  .ground { border-left: 3px solid var(--muted); padding-left: 11px; margin-top: 10px; }
  .ground.quote { border-left-color: var(--g-quote); }
  .ground.unknown-attribute { border-left-color: var(--g-unknown); }
  .ground.derived-fact { border-left-color: var(--g-derived); }
  .ground .kind { color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; font-size: 0.68rem; }
  .ground .body { font-size: 0.88rem; color: var(--ink-2); margin-top: 3px; }
  /* Three lines, and only when the quote is long enough to be worth hiding;
     anything that fits renders whole with no affordance at all. */
  .ground .body.clamped { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .ground .cite { font-size: 0.78rem; color: var(--muted); margin-top: 4px; }
  /* An unverified quote says so in words, on the line that qualifies what the
     reader is looking at — never in a `title`, which keyboard and touch cannot
     reach. */
  .ground .cite.unverified { color: var(--ink-2); font-weight: 600; }
  .ground .more { background: none; border: 0; padding: 0; margin-top: 4px; font: inherit;
    font-size: 0.78rem; color: var(--ink-2); text-decoration: underline; cursor: pointer; display: block; }
  .ground code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.8rem; }

  .unknown { margin-top: 10px; padding: 9px 12px; border-radius: 9px; font-size: 0.85rem;
    background: color-mix(in srgb, var(--sev-medium) 12%, var(--surface));
    border: 1px solid color-mix(in srgb, var(--sev-medium) 40%, var(--border)); color: var(--ink-2); }
  .unknown code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  /* Service marks: what the service checked on this draft and could not
     confirm. Deliberately outside the severity ramp *and* outside the grounds
     hues — these say something about how complete a finding is, not about how
     bad it is, and a reader who has learned two colour languages already must
     not be handed a third. Same treatment as an unverified quote's cite, which
     is the mark this repo already had. */
  .caveat { margin-top: 8px; font-size: 0.78rem; color: var(--ink-2); font-weight: 600; }
  .caveat code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.78rem; font-weight: 400; }

  /* tables */
  table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--hairline); vertical-align: top; }
  th { color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; font-size: 0.68rem; font-weight: 600; }
  td code, .crossing code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.8rem; }
  td .unk { color: var(--sev-high); font-weight: 600; }
  .crossing { font-size: 0.85rem; color: var(--ink-2); padding: 6px 0; }
  .assume { font-size: 0.85rem; color: var(--ink-2); }

  .nodes { display: flex; flex-wrap: wrap; gap: 8px; }
  .node { font-size: 0.76rem; color: var(--ink-2); background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 4px 10px; }
  .node b { font-weight: 600; color: var(--ink); }
  .node .m { color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  /* Spacing that used to ride in style="" attributes. The report page runs
     under a strict nonce CSP with no 'unsafe-inline', which blocks inline
     style attributes; a class costs nothing and a generated one-off colour
     goes through element.style.* instead, which CSP does not govern. */
  .mixwrap { margin-top: 18px; }
  .belowtable { margin-top: 12px; }
</style>
</head>
<body>
<div class="viz-root">
  <div class="wrap">
    <div class="topbar">
      <div>
        <h1 id="sysname"></h1>
        <div class="meta" id="jobmeta"></div>
      </div>
      <button class="toggle" id="themebtn" type="button">Toggle theme</button>
    </div>
    <div class="disclaimer"><span class="dot"></span><span id="disclaimer"></span></div>

    <h2>Summary</h2>
    <div class="tiles" id="tiles"></div>
    <div class="mixwrap">
      <div class="mix" id="mix"></div>
      <div class="mixlegend" id="mixlegend"></div>
    </div>

    <h2>Threats</h2>
    <div id="threats"></div>

    <h2>Rejected — considered and dismissed</h2>
    <div id="rejected"></div>

    <h2>System model (extracted DFD)</h2>
    <table id="elements"><thead><tr>
      <th>Type</th><th>ID</th><th>Name</th><th>Trust zone</th><th>Key attributes</th>
    </tr></thead><tbody></tbody></table>
    <div id="crossings" class="belowtable"></div>
    <div id="assumptions" class="belowtable"></div>

    <h2>Pipeline</h2>
    <div class="nodes" id="nodes"></div>
  </div>
</div>

<!-- webapp/main.py replaces the contents of the block below with the run's
     report JSON, every `<` escaped, before serving this page. -->
<script type="application/json" id="report" nonce="__CSP_NONCE__">{}</script>

<script nonce="__CSP_NONCE__">
  // Every string in R is untrusted: model-authored from the submitter's own
  // prose, or supplied by the caller. None of it is escaped for HTML.
  //
  // So nothing on this page interpolates a value into innerHTML. Text goes in
  // as textContent and structure is built as DOM nodes — which is why there is
  // no escape helper here to forget to call. That discipline had already
  // failed once, unnoticed, in the element table's attribute column. Forgetting
  // `textContent` now shows junk on screen instead of executing script.
  //
  // `append` is the primitive that makes this cheap: it takes nodes and
  // strings, and a string always becomes a text node, never markup.
  const R = JSON.parse(document.getElementById("report").textContent);
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  };
  const code = (text) => el("code", null, text);
  const lbl = (text) => el("span", "lbl", text);
  const cell = (...kids) => { const n = el("td"); n.append(...kids); return n; };

  // Each branch named in its own words, so the three read as different *kinds*
  // of justification rather than three formattings of one.
  const GROUND_KIND = {
    "quote": "Quoted from the submission",
    "unknown-attribute": "Unstated in the submission",
    "derived-fact": "Derived from the model",
  };
  // Past this, a quote is clamped to three lines behind a toggle. Short quotes
  // are the common case and get no affordance.
  const CLAMP_OVER = 220;
  // "<threat id>#<grounds index>" for every quote the service looked for in its
  // named source and could not find.
  const UNVERIFIED = new Map(
    (R.unverified_grounds || []).map(u => [`${u.threat_id}#${u.index}`, u])
  );
  // Every element ID a description cites that the embedded model does not
  // contain, gathered under the threat that cites it. Defaulted like the map
  // above: a report from before these marks existed simply has none.
  const MENTIONS = new Map();
  (R.unresolved_mentions || []).forEach(m => {
    if (!MENTIONS.has(m.threat_id)) MENTIONS.set(m.threat_id, []);
    MENTIONS.get(m.threat_id).push(m.mention);
  });
  // Every evidence reference a threat cited that its job's catalog did not
  // hold, gathered under the threat that cited it. Unlike an unverified quote
  // there is nothing to render in the grounds list — no ground was ever built
  // from these — so the note is the only trace a reader gets that the agent
  // reached for a fact that does not exist.
  const UNRESOLVED_EVIDENCE = new Map();
  (R.unresolved_evidence || []).forEach(m => {
    if (!UNRESOLVED_EVIDENCE.has(m.threat_id)) UNRESOLVED_EVIDENCE.set(m.threat_id, []);
    UNRESOLVED_EVIDENCE.get(m.threat_id).push(m.reference);
  });
  // Threats offering no countermeasure and carrying no unknown that would
  // excuse offering none. The excused ones are not in this set and get no
  // note — their unknown-attribute ground already says why the list is empty.
  const UNMITIGATED = new Set((R.missing_mitigations || []).map(m => m.threat_id));

  const SEV = { critical: ["Critical","--sev-critical"], high: ["High","--sev-high"], medium: ["Medium","--sev-medium"], low: ["Low","--sev-low"] };
  const SEV_ORDER = ["critical","high","medium","low"];
  const VERDICT = { confirmed: ["Confirmed","✓"], "needs-info": ["Needs info","?"], rejected: ["Rejected","✕"] };
  const svar = (lvl) => `var(${SEV[lvl][1]})`;

  // header
  $("sysname").textContent = R.input.system_name;
  const fmt = (t) => new Date(t).toISOString().replace("T"," ").replace(".000Z"," UTC");
  $("jobmeta").append(
    "Job ", code(R.job.id), ` · ${R.job.status} · ${fmt(R.job.completed_at)} · schema ${R.schema_version}`
  );
  $("disclaimer").textContent = R.disclaimer;

  // stat tiles
  const tiles = [
    [R.summary.threat_count, "Actionable threats"],
    [R.summary.needs_info_count, "Needs info"],
    [R.summary.rejected_count, "Rejected"],
    [R.summary.elements_analyzed, "Elements analysed"],
  ];
  tiles.forEach(([n, k]) => { const t = el("div","tile"); t.append(el("div","n",String(n)), el("div","k",k)); $("tiles").append(t); });

  // severity mix bar (only levels present, in severity order) with direct-labelled legend
  const present = SEV_ORDER.filter(l => R.summary.by_severity[l]);
  const total = present.reduce((a,l) => a + R.summary.by_severity[l], 0) || 1;
  present.forEach(l => { const s = el("span"); s.style.flex = R.summary.by_severity[l]; s.style.background = svar(l); $("mix").append(s); });
  present.forEach(l => {
    const item = el("div");
    const swatch = el("span", "swatch");
    swatch.style.background = svar(l);
    item.append(swatch, `${SEV[l][0]} · ${R.summary.by_severity[l]}`);
    $("mixlegend").append(item);
  });

  // One grounds entry. Every string here is model-authored or lifted verbatim
  // out of the submitter's own prose, so it goes in as text and never as markup.
  function groundEntry(threatId, ground, index) {
    const row = el("div", "ground " + ground.kind);
    row.append(el("div", "kind", GROUND_KIND[ground.kind] || ground.kind));
    const body = el("div", "body");
    if (ground.kind === "quote") {
      const unverified = UNVERIFIED.get(`${threatId}#${index}`);
      // The quotation marks assert a verbatim span the service found. When it
      // did not, they come off — the claim they make is the one that failed.
      body.textContent = unverified ? ground.text : `“${ground.text}”`;
      row.append(body);
      if (ground.text.length > CLAMP_OVER) {
        body.classList.add("clamped");
        const more = el("button", "more", "Show full quote");
        more.type = "button";
        more.addEventListener("click", () => {
          const clamped = body.classList.toggle("clamped");
          more.textContent = clamped ? "Show full quote" : "Show less";
        });
        row.append(more);
      }
      const cite = el("div", "cite" + (unverified ? " unverified" : ""));
      cite.append(unverified ? `⚠ not found in ${ground.source_label}`
                             : `— ${ground.source_label}`);
      row.append(cite);
      return row;
    }
    if (ground.kind === "unknown-attribute") {
      body.append(code(ground.element_id), " → ", code(ground.attribute));
    } else {
      body.append(code(ground.flow_id));
    }
    row.append(body);
    return row;
  }

  function groundsBlock(t) {
    const block = el("div", "grounds");
    block.append(lbl("Grounds — why this was raised"));
    t.grounds.forEach((g, i) => block.append(groundEntry(t.id, g, i)));
    return block;
  }

  function threatCard(t, rejected) {
    const card = el("div", "card" + (rejected ? " rejected" : ""));
    card.style.borderLeftColor = svar(t.severity.level);
    const head = el("div","card-head");
    head.append(el("h3", null, t.title), el("span","tid", t.id));
    card.append(head);
    card.append(el("div","cat", t.category));

    const badges = el("div","badges");
    const sev = el("span","chip");
    const sevSwatch = el("span","swatch");
    sevSwatch.style.background = svar(t.severity.level);
    sev.append(sevSwatch, SEV[t.severity.level][0]);
    // A property assignment, not an attribute: there is no markup context to
    // escape out of, which is why no quote handling is needed anywhere here.
    sev.title = `likelihood ${t.severity.likelihood} × impact ${t.severity.impact} → ${t.severity.level}`;
    const [vlabel, vglyph] = VERDICT[t.verdict.status];
    const vd = el("span","chip verdict", `${vglyph} ${vlabel}`);
    const conf = el("span","chip confidence", `confidence: ${t.confidence}`);
    badges.append(sev, vd, conf);
    card.append(badges);

    card.append(el("div","desc", t.description));

    // Directly under the argument it qualifies. The prose above cites an
    // element this report does not describe, which a reader following the ID
    // into the model table below would otherwise discover by finding nothing.
    const mentions = MENTIONS.get(t.id);
    if (mentions && mentions.length) {
      const note = el("div", "caveat");
      note.append("⚠ Cited above but not in the system model: ");
      mentions.forEach((m, i) => { if (i) note.append(", "); note.append(code(m)); });
      card.append(note);
    }

    // Beside it, and deliberately worded as a citation failure rather than a
    // doubt about the finding: the grounds shown below are the ones that did
    // resolve, and they are why this threat is still here.
    const composed = UNRESOLVED_EVIDENCE.get(t.id);
    if (composed && composed.length) {
      const note = el("div", "caveat");
      note.append("⚠ Cited evidence not in this job's catalog, and dropped: ");
      composed.forEach((r, i) => { if (i) note.append(", "); note.append(code(r)); });
      card.append(note);
    }

    const rationale = el("div","field");
    rationale.append(lbl("Severity rationale"), el("br"), t.severity.justification);
    card.append(rationale);

    const refs = el("div","field refs");
    refs.append(lbl("Affected elements"), el("br"));
    t.affected_element_ids.forEach(r => refs.append(code(r)));
    card.append(refs);

    // After the analysis, not before it: the card's job on first read is
    // triage, and attribution is what you turn to once a finding has your
    // attention.
    card.append(groundsBlock(t));

    // A needs-info banner may repeat an element/attribute pair that also
    // appears as an unknown-attribute ground above. Both stay: the ground is
    // the category agent's *trigger*, the banner is the critic's citation for
    // its *verdict*. Different authors, and this block's whole value is that it
    // says who justified what.
    if (t.verdict.status === "needs-info" && t.verdict.related_unknowns.length) {
      const u = el("div","unknown");
      u.append(el("b", null, "Needs info."), ` ${t.verdict.reason} Unknown: `);
      t.verdict.related_unknowns.forEach((r, i) => {
        if (i) u.append(", ");
        u.append(code(r.element_id), " → ", code(r.attribute));
      });
      card.append(u);
    }
    if (t.verdict.status === "rejected") {
      const why = el("div","field");
      why.append(lbl("Reason dismissed"), el("br"), t.verdict.reason);
      card.append(why);
    }
    if (t.mitigations && t.mitigations.length) {
      const list = el("ul","mits"); t.mitigations.forEach(m => list.append(el("li", null, m.summary)));
      const wrap = el("div","field"); wrap.append(el("div","lbl","Mitigations"), list); card.append(wrap);
    } else if (UNMITIGATED.has(t.id)) {
      // Where the Mitigations block would have been, so its absence is stated
      // rather than left as a gap the reader has to notice.
      card.append(el("div", "caveat",
        "⚠ No mitigation proposed, and this finding does not rest on an unknown that would explain why."));
    }
    return card;
  }

  const ordered = [...R.threats].sort((a,b) => SEV_ORDER.indexOf(a.severity.level) - SEV_ORDER.indexOf(b.severity.level));
  ordered.forEach(t => $("threats").append(threatCard(t, false)));
  R.rejected_threats.forEach(t => $("rejected").append(threatCard(t, true)));

  // system model table. Each entry returns the cell's children rather than a
  // string of markup — `technology`, `protocol`, `authentication` and
  // `data_classification` are free-text copied out of submitted prose, and this
  // column is where the unescaped-innerHTML bug lived.
  const attrs = {
    "external-entity": e => [
      `kind: ${e.kind}` + (e.assets.length ? ` · assets: ${e.assets.join(", ")}` : ""),
    ],
    "process": e => [`${e.technology} · exposure: ${e.exposure}`],
    "data-store": e => [
      `${e.technology} · ${e.data_classification} · at rest: `, mark(e.encryption_at_rest),
    ],
    "data-flow": e => [
      `${e.protocol} · auth: ${e.authentication} · in transit: `, mark(e.encryption_in_transit),
    ],
  };
  function mark(v){ return v === "unknown" ? el("span", "unk", "unknown") : v; }
  const rows = [
    ...R.system_model.external_entities.map(e => ["external-entity", e]),
    ...R.system_model.processes.map(e => ["process", e]),
    ...R.system_model.data_stores.map(e => ["data-store", e]),
    ...R.system_model.data_flows.map(e => ["data-flow", e]),
  ];
  const tb = $("elements").querySelector("tbody");
  rows.forEach(([type, e]) => {
    const zone = e.trust_zone || (e.source + " → " + e.destination);
    const tr = el("tr");
    tr.append(
      cell(type), cell(code(e.id)), cell(e.name), cell(code(zone)), cell(...attrs[type](e))
    );
    tb.append(tr);
  });
  R.boundary_crossings.forEach(c => {
    const d = el("div","crossing");
    d.append(
      "Boundary crossing: ", code(c.flow_id), " — ",
      code(c.source_zone), " → ", code(c.destination_zone)
    );
    $("crossings").append(d);
  });
  R.system_model.assumptions.forEach(a => {
    const d = el("div","assume");
    d.append(`Assumption: ${a.assumption} (`, code(a.element_id), `) — ${a.basis}`);
    $("assumptions").append(d);
  });

  // pipeline
  R.nodes.forEach(n => {
    const row = el("div","node");
    row.append(
      el("b", null, n.node), " ",
      el("span", "m", n.model ? n.model : "code"), ` · ${n.duration_ms} ms`
    );
    if (n.sampling_fingerprint) {
      const fp = el("code", "m", `fp ${n.sampling_fingerprint.slice(0, 12)}…`);
      fp.title = `generation-identity fingerprint: sha256(served model, resolved tier sampling)\n${n.sampling_fingerprint}`;
      row.append(" · ", fp);
    }
    $("nodes").append(row);
  });
  // per-tier resolved sampling (provenance clear block)
  Object.entries(R.sampling || {}).forEach(([tier, params]) => {
    const set = Object.entries(params).filter(([, v]) => v !== null)
      .map(([k, v]) => `${k} = ${v}`).join(", ");
    const row = el("div","node m");
    row.append(
      el("b", null, `tier ${tier}`), ` sampling · ${set} `,
      el("span", "m", "(others: model default)")
    );
    $("nodes").append(row);
  });

  // theme toggle
  $("themebtn").addEventListener("click", () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const dark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
  });
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Report</title>
<style nonce="__CSP_NONCE__">
  /* Palette roles (dataviz reference instance). Status hues are fixed, never themed. */
  .viz-root {
    color-scheme: light;
    --plane:        #f9f9f7;
    --surface:      #fcfcfb;
    --surface-2:    #f2f2ee;
    --ink:          #0b0b0b;
    --ink-2:        #52514e;
    --muted:        #898781;
    --border:       rgba(11,11,11,0.10);
    --hairline:     #e1e0d9;
    /* severity = status palette: critical / high(serious) / medium(warning) / low(good) */
    --sev-critical: #d03b3b;
    --sev-high:     #ec835a;
    --sev-medium:   #fab219;
    --sev-low:      #0ca30c;
    /* Grounds kinds. Deliberately outside the severity ramp above: nothing in
       the grounds block is a severity signal, and a reader who has just learned
       red-to-green means severity must not read these as a fourth band. */
    --g-quote:      #3c6ecb;
    --g-unknown:    #7a52c4;
    --g-absent:     #a63f95;
    --g-derived:    #1f8a86;
    --tint:         color-mix(in srgb, var(--surface) 88%, transparent);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      color-scheme: dark;
      --plane:    #0d0d0d;
      --surface:  #1a1a19;
      --surface-2:#242422;
      --ink:      #ffffff;
      --ink-2:    #c3c2b7;
      --muted:    #898781;
      --border:   rgba(255,255,255,0.10);
      --hairline: #2c2c2a;
      --g-quote:  #7ea6ee;
      --g-unknown:#ac8ce8;
      --g-absent: #d47fc6;
      --g-derived:#49b6b1;
    }
  }
  :root[data-theme="dark"] .viz-root {
    color-scheme: dark;
    --plane:#0d0d0d; --surface:#1a1a19; --surface-2:#242422;
    --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781; --border:rgba(255,255,255,0.10); --hairline:#2c2c2a;
    --g-quote:#7ea6ee; --g-unknown:#ac8ce8; --g-absent:#d47fc6; --g-derived:#49b6b1;
  }

  * { box-sizing: border-box; }
  body { margin: 0; }
  .viz-root {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--plane); color: var(--ink);
    line-height: 1.5; padding: 32px 20px 64px;
  }
  .wrap { max-width: 940px; margin: 0 auto; }

  .topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em;
       color: var(--muted); margin: 40px 0 14px; font-weight: 600; }
  /* Inside an analysis section: one step down from the framework's own heading,
     so "Claims" reads as belonging to the framework named above it rather than
     as a peer of it. With one framework selected the nesting is invisible;
     with two it is the whole navigation. */
  /* Direct children only: a claim card carries its own `h3` for the claim
     title, and a descendant selector here would repaint every one of them in
     the section-heading style. */
  .analysis > h3 { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em;
       color: var(--muted); margin: 28px 0 12px; font-weight: 600; }
  .analysis { border-top: 1px solid var(--border); margin-top: 8px; }
  .meta { color: var(--ink-2); font-size: 0.85rem; }
  .meta code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  .toggle { border: 1px solid var(--border); background: var(--surface); color: var(--ink-2);
    border-radius: 8px; padding: 6px 12px; font: inherit; font-size: 0.8rem; cursor: pointer; }
  .toggle:hover { color: var(--ink); }

  .disclaimer { margin-top: 16px; padding: 10px 14px; border-radius: 10px;
    background: var(--tint); border: 1px solid var(--border); color: var(--ink-2); font-size: 0.85rem;
    display: flex; gap: 8px; align-items: center; }
  .disclaimer .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--sev-medium); flex: none; }
  /* The package's own disclaimer. Quieter than the envelope's, and without the
     dot: the envelope's says what the service is and is read once, while this
     says what one framework's claims assert and is read per section. */
  .disclaimer-block { color: var(--ink-2); font-size: 0.82rem; margin: 0 0 16px;
    padding-left: 12px; border-left: 2px solid var(--border); }

  /* Rulings the service discarded. Set apart from the disclaimer because it
     reports on this run rather than on the method, and kept quiet because it
     is a note about what is missing, not a finding. */
  .dropped { color: var(--ink-2); font-size: 0.82rem; margin: 0 0 16px;
    padding-left: 12px; border-left: 2px solid var(--sev-medium); }
  .dropped ul { margin: 4px 0 0; padding-left: 18px; }
  .dropped code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  /* stat tiles */
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .tile .n { font-size: 1.9rem; font-weight: 650; letter-spacing: -0.02em; }
  .tile .k { color: var(--muted); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; margin-top: 2px; }
  @media (max-width: 620px) { .tiles { grid-template-columns: repeat(2, 1fr); } }

  /* severity mix bar */
  .mix { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--surface-2); gap: 2px; }
  .mix span { display: block; }
  .mixlegend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; font-size: 0.82rem; color: var(--ink-2); }
  .mixlegend .swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; margin-right: 6px; vertical-align: middle; }

  /* threat cards */
  .card { background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--muted);
    border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; }
  .card.rejected { opacity: 0.9; border-left-color: var(--muted); background: var(--surface-2); }
  .card-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .card h3 { font-size: 1.02rem; margin: 0; flex: 1 1 260px; }
  .tid { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); font-size: 0.82rem; }
  .cat { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-2); }
  .desc { margin: 10px 0 12px; color: var(--ink-2); font-size: 0.92rem; }
  /* An identifier inside model prose. Sized in `em` so it tracks whatever the
     surrounding block sets, from a card heading down to a mitigation. */
  .card h3 code, .desc code, .field code, ul.mits code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.9em; }

  .badges { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 0.75rem; font-weight: 600;
    padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border); white-space: nowrap; }
  .chip .swatch { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .chip.verdict { color: var(--ink-2); background: var(--surface); }
  .chip.confidence { color: var(--muted); background: transparent; border-color: var(--hairline); }

  .field { font-size: 0.85rem; margin-top: 8px; }
  .field .lbl { color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; font-size: 0.68rem; }
  .refs code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.8rem;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 1px 6px; margin-right: 6px; }
  ul.mits { margin: 6px 0 0; padding-left: 18px; font-size: 0.88rem; color: var(--ink-2); }

  /* grounds rail — why the finding was raised, under the analysis */
  .grounds { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--hairline); }
  .ground { border-left: 3px solid var(--muted); padding-left: 11px; margin-top: 10px; }
  .ground.quote { border-left-color: var(--g-quote); }
  .ground.unknown-attribute { border-left-color: var(--g-unknown); }
  .ground.absent-attribute { border-left-color: var(--g-absent); }
  .ground.derived-fact { border-left-color: var(--g-derived); }
  .ground .kind { color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; font-size: 0.68rem; }
  .ground .body { font-size: 0.88rem; color: var(--ink-2); margin-top: 3px; }
  /* Three lines, and only when the quote is long enough to be worth hiding;
     anything that fits renders whole with no affordance at all. */
  .ground .body.clamped { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .ground .cite { font-size: 0.78rem; color: var(--muted); margin-top: 4px; }
  /* An unverified quote says so in words, on the line that qualifies what the
     reader is looking at — never in a `title`, which keyboard and touch cannot
     reach. */
  .ground .cite.unverified { color: var(--ink-2); font-weight: 600; }
  .ground .more { background: none; border: 0; padding: 0; margin-top: 4px; font: inherit;
    font-size: 0.78rem; color: var(--ink-2); text-decoration: underline; cursor: pointer; display: block; }
  .ground code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.8rem; }

  .unknown { margin-top: 10px; padding: 9px 12px; border-radius: 9px; font-size: 0.85rem;
    background: color-mix(in srgb, var(--sev-medium) 12%, var(--surface));
    border: 1px solid color-mix(in srgb, var(--sev-medium) 40%, var(--border)); color: var(--ink-2); }
  .unknown code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  /* Service marks: what the service checked on this draft and could not
     confirm. Deliberately outside the severity ramp *and* outside the grounds
     hues — these say something about how complete a finding is, not about how
     bad it is, and a reader who has learned two colour languages already must
     not be handed a third. Same treatment as an unverified quote's cite, which
     is the mark this repo already had. */
  .caveat { margin-top: 8px; font-size: 0.78rem; color: var(--ink-2); font-weight: 600; }
  .caveat code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.78rem; font-weight: 400; }

  /* tables */
  table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--hairline); vertical-align: top; }
  th { color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; font-size: 0.68rem; font-weight: 600; }
  td code, .crossing code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.8rem; }
  td .unk { color: var(--sev-high); font-weight: 600; }
  .crossing { font-size: 0.85rem; color: var(--ink-2); padding: 6px 0; }
  .assume { font-size: 0.85rem; color: var(--ink-2); }

  .nodes { display: flex; flex-wrap: wrap; gap: 8px; }
  .node { font-size: 0.76rem; color: var(--ink-2); background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 4px 10px; }
  .node b { font-weight: 600; color: var(--ink); }
  .node .m { color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  /* Spacing that used to ride in style="" attributes. The report page runs
     under a strict nonce CSP with no 'unsafe-inline', which blocks inline
     style attributes; a class costs nothing and a generated one-off colour
     goes through element.style.* instead, which CSP does not govern. */
  .mixwrap { margin-top: 18px; }
  .belowtable { margin-top: 12px; }
</style>
</head>
<body>
<div class="viz-root">
  <div class="wrap">
    <div class="topbar">
      <div>
        <h1 id="sysname"></h1>
        <div class="meta" id="jobmeta"></div>
      </div>
      <button class="toggle" id="themebtn" type="button">Toggle theme</button>
    </div>
    <div class="disclaimer"><span class="dot"></span><span id="disclaimer"></span></div>

    <!-- A fact about the shared model rather than about any analysis, so it is
         stated once here instead of being copied into each block: N copies
         would be N chances to disagree about one number. -->
    <div class="meta" id="scope"></div>

    <!-- One section per framework the job selected, built in JS: the count and
         the names are the report's, not this file's. Everything outside it
         describes the one shared System Model, which every framework analysed. -->
    <div id="analyses"></div>

    <h2>System model (extracted DFD)</h2>
    <table id="elements"><thead><tr>
      <th>Type</th><th>ID</th><th>Name</th><th>Trust zone</th><th>Key attributes</th>
    </tr></thead><tbody></tbody></table>
    <div id="crossings" class="belowtable"></div>
    <div id="assumptions" class="belowtable"></div>

    <h2>Pipeline</h2>
    <div class="nodes" id="nodes"></div>
  </div>
</div>

<!-- webapp/main.py replaces the contents of the block below with the run's
     report JSON, every `<` escaped, before serving this page. -->
<script type="application/json" id="report" nonce="__CSP_NONCE__"><!--report--></script>

<script nonce="__CSP_NONCE__"><!--script--></script>
</body>
</html>

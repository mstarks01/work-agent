<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings · Work Agent</title>
<style nonce="__CSP_NONCE__"><!--workspace_style-->
  .settings-search { max-width:24rem; margin-bottom:16px; }
  .table-wrap { overflow-x:auto; }
  table.settings { display:table; width:100%; border-collapse:collapse; font-size:13px; }
  table.settings th, table.settings td { text-align:left; padding:8px; vertical-align:top;
    border-bottom:1px solid var(--line); overflow-wrap:anywhere; }
  table.settings tr.groupline th { background:var(--sidebar); font-size:12px; }
  table.settings small { display:block; }
  table.settings code { font-size:12px; }
  .tag { font-size:11px; padding:1px 7px; border-radius:999px; border:1px solid var(--line);
    color:var(--muted); white-space:nowrap; }
  .tag.outside { border-color:var(--accent); color:var(--accent); }
  .not-set { color:var(--muted); font-style:italic; }
  .settings-layout { display:grid; grid-template-columns:minmax(0,1fr) 18rem; gap:24px; align-items:start; }
  .settings-layout:has(> .changes-column[hidden]) { grid-template-columns:minmax(0,1fr); }
  .changes-column { position:sticky; top:16px; }
  .changes-panel { border:1px solid var(--line); border-radius:8px; padding:12px; }
  .changes-panel h2 { font-size:15px; margin:0 0 8px; }
  .changes-panel ul { padding-left:18px; margin:0 0 12px; font-size:13px; }
  .changes-panel li + li { margin-top:8px; }
  .changes-panel .pending-note { display:block; margin-top:4px; }
  .changes-panel .discard-edit { margin-top:4px; padding:2px 0; }
  .changes-panel .actions { display:flex; gap:8px; flex-wrap:wrap; }
  .choices { border:0; padding:0; margin:0; display:flex; gap:12px; flex-wrap:wrap; }
  table.settings input[type=text], table.settings input[type=number], table.settings select { width:100%; max-width:22rem; }
  table.settings input[aria-invalid=true] { border-color:var(--error); background:var(--error-bg); }
  .field-error { display:block; margin-top:4px; color:var(--error); }
  .changes-column .problem { margin-top:12px; }
  .saved { border:1px solid var(--line); border-radius:8px; padding:8px 12px; margin-bottom:16px; }
  @media (max-width: 800px) { .settings-layout { grid-template-columns:minmax(0,1fr); } .changes-column { position:static; } }
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="workspace">
  <aside class="sidebar">
    <!--sidebar-->
  </aside>
  <div class="workspace-body">
    <main id="main">
      <h1>Settings</h1>
      <div id="engine-error" class="problem" role="alert" hidden></div>
      <div id="unknown-lines" class="problem" role="alert" hidden></div>
      <div id="save-status" class="saved" role="status" hidden></div>
      <label class="field-label" for="settings-search">Find a setting</label>
      <div class="settings-layout">
        <div>
          <input type="search" id="settings-search" class="settings-search" placeholder="Name of a setting">
          <div class="table-wrap">
            <table class="settings">
              <thead><tr><th scope="col">Setting</th><th scope="col">Value</th><th scope="col">Source</th></tr></thead>
              <tbody id="settings-rows"></tbody>
            </table>
          </div>
          <p class="hint">A save writes <code id="settings-file"></code>, and each key to its own file beside it, and applies at once, except a job storage setting, which takes effect after a restart. A hand edit of the file applies after a restart.</p>
        </div>
        <div id="changes-column" class="changes-column" hidden>
          <aside id="changes-panel" class="changes-panel" aria-labelledby="changes-heading">
            <h2 id="changes-heading">Unsaved changes</h2>
            <ul id="changes-list"></ul>
            <div class="actions">
              <button type="button" id="save-changes" class="primary" disabled>Check and save</button>
              <button type="button" id="discard-changes" disabled>Discard</button>
            </div>
          </aside>
          <div id="save-errors" class="problem" role="alert" hidden></div>
        </div>
      </div>
      <div id="model-lists"></div>
    </main>
  </div>
</div>
<script type="application/json" id="settings" nonce="__CSP_NONCE__"><!--settings--></script>
<script nonce="__CSP_NONCE__"><!--script--></script>
</body>
</html>

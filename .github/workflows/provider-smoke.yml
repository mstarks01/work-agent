# The live provider smoke: one small job per vendor, on every merge to main.
#
# WHAT THIS IS FOR, and it is the half of #116 the offline suite cannot reach.
# `ci.yml` runs the credential-free conformance suite for Vertex, Anthropic and
# OpenAI equally, and that suite is explicit about its own limit: it establishes
# what each provider *would be asked for*, never that a provider has served a
# request. This workflow asks the second question, for every vendor, on the same
# trigger -- which is what "comparable smoke coverage for supported providers"
# means. Where a vendor's credentials are absent its lane reports itself
# UNEXERCISED rather than skipping quietly, because a silent lane and a passing
# one look identical in a check list.
#
# NOT AN EVAL, and the separation is load-bearing. `evals-live.yml` and
# `evals-live-api-key.yml` sweep the twelve-case golden corpus for *quality* and
# cost real money per run. This runs `python -m analysis_service.smoke`: one
# ~600-character system, once, through the shipped graph -- roughly eight model
# calls on a tiny input. Nothing here scores a threat model, and no lane fails
# because one vendor's threats are weaker than another's. #116 lists that
# conflation as the thing to remove and "require expensive full-model
# evaluations on every PR" as a non-goal.
#
# WHY ONE FILE, where the two eval sweeps are deliberately two. The rule those
# files state is that a job holding a long-lived third-party API key must not
# also hold an OIDC identity it could exchange for cloud credentials. What
# enforces that is the *job* boundary -- `permissions:` and the secrets a job
# references are per job, and a workflow file confers no isolation of its own.
# There, one job with a two-leg matrix could not express it, because matrix legs
# share their job's permissions; here the vendors are separate jobs, so the
# vertex job below holds `id-token: write` and names no secret, and the api-key
# job holds no identity at all. Splitting these into two files would add nothing
# except a second place for the smoke's shape to drift.
#
# NO CREDENTIAL-BEARING JOB RUNS MUTABLE PR-HEAD CODE, and that is the rule this
# file exists to obey rather than a property of which trigger looks safest.
# `pull_request_target` was already prohibited repository-wide for the reason
# `evals-live.yml` gives at greater length: combined with a PR-head checkout it
# runs untrusted code while holding credentials. Plain `pull_request` reaches
# the same place by a longer road. It skips forks, but it does not skip a
# collaborator, and a collaborator who can push a branch and open a pull request
# can edit `src/analysis_service/**` -- which this job imports -- or edit this
# file, and have the edit execute while the job holds an OIDC identity or a
# provider key. Repository-scoped federation cannot tell that code from main's.
#
# So the trigger is `push` on main: the code that runs has already passed
# review, and the checkout is of a ref nobody can rewrite unreviewed. What a
# pull request gets instead is `ci.yml`'s offline conformance suite, which
# establishes what each provider would be asked for and holds no credential to
# lose. The smoke answers the second question one merge later.
#
# `workflow_dispatch` stays, and the ref guard below is what keeps it honest: a
# dispatch can name any ref, so without the guard it would be the pull_request
# hole with a manual step in front of it.
name: Provider smoke

on:
  push:
    branches: [main]
    # The whole agentic surface, and *not* the subtracted closure
    # `evals-live.yml` carries. That filter exists because the eval harness
    # cannot reach every module; this workflow drives the shipped engine, so a
    # change anywhere in the package can change what it does. A coarse filter
    # that occasionally fires spuriously is the right error to make for a lane
    # whose whole selling point is that it is cheap.
    paths:
      - "prompts/**"
      - "frameworks/**"
      - "domains/**"
      - "config/**"
      - "src/analysis_service/**"
      - ".github/workflows/provider-smoke.yml"
  workflow_dispatch:

permissions: {}

# Its own group, deliberately NOT the `evals-live` one. That group serializes
# spend across the corpus sweeps, and a smoke queued behind a 90-minute sweep
# would report a provider outage that ended an hour earlier. cancel-in-progress
# is true for the opposite reason it is false there: superseding a smoke costs
# a few cents, and the result being cancelled was about an older commit.
concurrency:
  group: provider-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vertex:
    name: Smoke (vertex)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The ref guard, and it is the whole of the trust boundary in this file.
    # `push` on main already implies it; `workflow_dispatch` does not, because
    # a dispatch names its own ref and anyone with write access can point one
    # at an unreviewed branch. Written as a condition here rather than left to
    # the trigger list, so adding a trigger cannot quietly widen what runs with
    # this job's identity.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      # The OIDC token exchanged for short-lived Vertex credentials. This job
      # references no `secrets.ANALYSIS_*_API_KEY` and must not start to: see the
      # header for why the identity and the bearer keys stay in separate jobs.
      id-token: write

    # Pinned here rather than read from config/model_tiers.toml, which selects
    # no vendor at all -- so a live lane has to name one. The pair is the same
    # one `analysis_service.conformance.REFERENCE_MODELS` profiles, and
    # tests/test_conformance.py fails if this file drifts from it: a lane
    # sweeping an unprofiled pair is how a vendor ends up "covered" by a job
    # nobody has checked the capabilities of.
    env:
      ANALYSIS_MODEL_BASE_VENDOR: vertex
      ANALYSIS_MODEL_BASE_MODEL: gemini-2.5-flash
      ANALYSIS_MODEL_STRONG_VENDOR: vertex
      ANALYSIS_MODEL_STRONG_MODEL: gemini-2.5-pro
      ANALYSIS_VERTEX_PROJECT: ${{ vars.GCP_PROJECT_ID }}
      ANALYSIS_VERTEX_LOCATION: ${{ vars.GCP_LOCATION }}

    steps:
      # Third-party actions are pinned by commit SHA, not tag: a moved tag runs
      # attacker code with this job's token.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # Federation is one-time GCP setup outside this repository
      # (.github/WORKLOAD_IDENTITY.md), so a green checkout says nothing about
      # whether it exists. Unconfigured, this lane states that it is
      # unexercised and stops; it does not fail. A red check for absent
      # infrastructure on every merge teaches people to ignore the lane, and
      # the whole point of this file is that people read it.
      #
      # Only variable *names* are ever printed.
      - name: Check federation is configured
        id: preflight
        shell: bash
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_EVAL_SERVICE_ACCOUNT: ${{ vars.GCP_EVAL_SERVICE_ACCOUNT }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_LOCATION: ${{ vars.GCP_LOCATION }}
        run: |
          set -euo pipefail

          missing=()
          for name in GCP_WORKLOAD_IDENTITY_PROVIDER GCP_EVAL_SERVICE_ACCOUNT \
                      GCP_PROJECT_ID GCP_LOCATION; do
            # :- because set -u treats indirect expansion of an unset name as
            # fatal. The env: block above always defines all four, so in CI they
            # are set-but-empty rather than unset -- but a guard that depends on
            # that distinction is not a guard.
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done

          if [[ ${#missing[@]} -eq 0 ]]; then
            echo "configured=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          echo "configured=false" >>"$GITHUB_OUTPUT"
          {
            echo "## Provider smoke: vertex is UNEXERCISED"
            echo
            echo "No Vertex request was made. Nothing in this run is evidence"
            echo "that Vertex serves this graph."
            echo
            echo "Workload Identity Federation is not configured. Unset:"
            # The backticks are markdown, not command substitution.
            # shellcheck disable=SC2016
            printf -- '- `%s`\n' "${missing[@]}"
            echo
            echo "See [.github/WORKLOAD_IDENTITY.md](.github/WORKLOAD_IDENTITY.md)."
          } >>"$GITHUB_STEP_SUMMARY"

          echo "::warning::vertex smoke unexercised -- federation is not" \
               "configured. Unset: ${missing[*]}."

      # Writes an external-account credentials file and exports
      # GOOGLE_APPLICATION_CREDENTIALS, which the vendor registry reads
      # explicitly (`vendors.ADC_VAR`) rather than discovering.
      - name: Authenticate to Google Cloud
        if: steps.preflight.outputs.configured == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_EVAL_SERVICE_ACCOUNT }}

      # Markdown on stdout goes to the job summary; the JSON is the artifact a
      # reader can diff between runs. The command exits non-zero when a check
      # failed or the run never happened, and zero when the only unanswered
      # questions are the provider's own -- an `unknown` is a capability
      # difference and must not turn a lane red.
      - name: Smoke
        if: steps.preflight.outputs.configured == 'true'
        run: |
          set -euo pipefail
          {
            echo "## Provider smoke: vertex"
            echo
            uv run python -m analysis_service.smoke --out smoke-vertex.json
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the smoke record
        if: always() && steps.preflight.outputs.configured == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-vertex-${{ github.run_id }}
          path: smoke-vertex.json
          if-no-files-found: warn
          retention-days: 30

  api-key:
    name: Smoke (${{ matrix.vendor }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Same guard, same reason. See the vertex job above.
    if: github.ref == 'refs/heads/main'
    # The approval boundary for the bearer keys. Scoping the secrets to an
    # environment lets a deployment add required reviewers and a deployment-
    # branch restriction without editing this file, and it is the second layer
    # behind the ref guard rather than a replacement for it -- an environment
    # nobody has configured protection rules on protects nothing, which is
    # exactly why the guard above does not depend on it.
    environment: live-providers
    permissions:
      contents: read
      # NO id-token. This job mounts a long-lived bearer key, so it must not
      # also hold an identity exchangeable for cloud credentials.

    strategy:
      # Independent measurements, not stages: the OpenAI lane's answer is worth
      # having when the Anthropic lane fails, and the reverse.
      fail-fast: false
      matrix:
        include:
          # Every leg runs the shipped sampling, unadjusted. That is worth
          # stating because it did not hold while the file pinned a
          # `temperature`: OpenAI's reasoning families serve that parameter
          # only at their own default, so the OpenAI leg had to strip the line
          # before it could bind, and the smoke measured a file nobody ships.
          - vendor: anthropic
            secret_name: ANALYSIS_ANTHROPIC_API_KEY
            base_model: claude-sonnet-4-6
            strong_model: claude-opus-5
          - vendor: openai
            secret_name: ANALYSIS_OPENAI_API_KEY
            base_model: gpt-4o
            strong_model: gpt-5.6

    env:
      ANALYSIS_MODEL_BASE_VENDOR: ${{ matrix.vendor }}
      ANALYSIS_MODEL_BASE_MODEL: ${{ matrix.base_model }}
      ANALYSIS_MODEL_STRONG_VENDOR: ${{ matrix.vendor }}
      ANALYSIS_MODEL_STRONG_MODEL: ${{ matrix.strong_model }}

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # States that the lane is unexercised and stops, rather than failing --
      # the same call the Vertex preflight above makes, for the same reason.
      # This differs from `evals-live-api-key.yml`, which fails closed on a
      # missing key: that workflow is dispatch-only, so every event it has did
      # ask for a live run. This one fires on every qualifying merge, which
      # did not.
      #
      # Only the secret's NAME is ever printed.
      - name: Check the vendor key is configured
        id: preflight
        shell: bash
        env:
          VENDOR_API_KEY: ${{ secrets[matrix.secret_name] }}
          SECRET_NAME: ${{ matrix.secret_name }}
          VENDOR: ${{ matrix.vendor }}
        run: |
          set -euo pipefail

          if [[ -n "${VENDOR_API_KEY:-}" ]]; then
            echo "configured=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          echo "configured=false" >>"$GITHUB_OUTPUT"
          {
            echo "## Provider smoke: ${VENDOR} is UNEXERCISED"
            echo
            echo "No ${VENDOR} request was made. Nothing in this run is evidence"
            echo "that ${VENDOR} serves this graph."
            echo
            echo "Unset repository secret: \`${SECRET_NAME}\`"
            echo
            echo '```sh'
            echo "gh secret set ${SECRET_NAME}"
            echo '```'
            echo
            echo "The name is vendor-scoped on purpose: the registry reads only"
            echo "its own ANALYSIS_-prefixed variables, so a plain"
            echo "\`${VENDOR^^}_API_KEY\` will not authenticate a run."
          } >>"$GITHUB_STEP_SUMMARY"

          echo "::warning::${VENDOR} smoke unexercised -- ${SECRET_NAME} is not set."

      # The key is exported under the vendor-scoped name the registry reads,
      # inside this step, from this leg's own secret. `secrets[matrix.secret_name]`
      # is what keeps a leg from holding the other vendor's key: the env block
      # names one secret, not both.
      - name: Smoke
        if: steps.preflight.outputs.configured == 'true'
        shell: bash
        env:
          VENDOR_API_KEY: ${{ secrets[matrix.secret_name] }}
          SECRET_NAME: ${{ matrix.secret_name }}
          VENDOR: ${{ matrix.vendor }}
        run: |
          set -euo pipefail
          export "${SECRET_NAME}=${VENDOR_API_KEY}"
          {
            echo "## Provider smoke: ${VENDOR}"
            echo
            uv run python -m analysis_service.smoke --out "smoke-${VENDOR}.json"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the smoke record
        if: always() && steps.preflight.outputs.configured == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-${{ matrix.vendor }}-${{ github.run_id }}
          path: smoke-${{ matrix.vendor }}.json
          if-no-files-found: warn
          retention-days: 30

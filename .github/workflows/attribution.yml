# No AI attribution: in a pull request's commits and body, and in every push
# to main. The owner's rule, and the check .githooks/check-attribution holds;
# the pre-push hook runs the same script over the commits it pushes.
#
# Its own workflow, so an edited pull request body is checked without running
# the whole offline suite again.
name: Attribution

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  attribution:
    name: No AI attribution
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The base branch's copy of the script, never the pull request's: a pull
      # request that edited the script would otherwise pass its own check. The
      # body reaches the script through the environment, never through the
      # command line, because a pull request author writes it.
      - name: Pull request commits and body
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          check="$RUNNER_TEMP/check-attribution"
          git show "$BASE_SHA:.githooks/check-attribution" > "$check"
          chmod +x "$check"
          "$check" "$BASE_SHA..$HEAD_SHA"
          printf '%s' "$PR_BODY" | "$check" --text

      - name: Pushed commits
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        # A new branch, or a forced push whose old tip this clone does not
        # hold, has no range to read, so the whole history of the tip is read.
        # The old tip's copy of the script reads the range where it exists, so
        # a push that edited the script is not checked by its own edit.
        run: |
          check="$RUNNER_TEMP/check-attribution"
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git show "$BEFORE:.githooks/check-attribution" > "$check"
            chmod +x "$check"
            "$check" "$BEFORE..$AFTER"
          else
            .githooks/check-attribution "$AFTER"
          fi

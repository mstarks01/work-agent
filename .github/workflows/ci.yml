# Offline CI.
#
# Everything here is credential-free by construction: the pytest suite, the
# corpus lints, the prompt/skill lints, and the eval scorer replayed over the
# recorded match labels in evals/calibration_labels/. No job here may ever be granted
# `id-token: write` — the offline/live split is the security boundary that
# keeps untrusted-PR-shaped work away from the Vertex identity, not a speed
# optimization. Live evals live in evals-live.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default; each job re-grants only what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  offline:
    name: Offline suite (no credentials)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      # Third-party actions are pinned by commit SHA, not tag: a tag is
      # mutable and a moved tag runs attacker code with this job's token.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true

      # --locked fails rather than resolving: CI must install the reviewed
      # uv.lock, not whatever the index offers today.
      - name: Install dependencies
        run: uv sync --locked

      # The browser tests' dependency group, and headless Chromium with the
      # system libraries it needs. REQUIRE_BROWSER on the test step makes a
      # missing browser fail the suite rather than skip its tests.
      - name: Install the browser
        run: |
          uv sync --locked --group browser
          uv run --group browser playwright install --with-deps chromium

      # Ruff's rule selection is its default set, held stable by the exact pin
      # in the uv.lock installed above — see the note in pyproject.toml.
      - name: Lint
        run: uv run ruff check .

      # The formatter's exclusions live in pyproject.toml.
      - name: Format
        run: uv run ruff format --check .

      # Scope and rule selection are in pyproject.toml's [tool.mypy], so this
      # step and a local `uv run mypy` check exactly the same thing.
      - name: Type check
        run: uv run mypy

      # Audits the locked dependency closure, not the installed environment:
      # `uv export --frozen` fails rather than re-resolving, so the input is the
      # same reviewed uv.lock the install above used, and every hash in it is
      # printed for a human to check against the advisory.
      #
      # Credential-free, like everything else in this job -- the advisory
      # lookup is an anonymous request to PyPI, so the offline/live boundary
      # described in the header is untouched. It does need egress, which is why
      # a failure here can mean "the advisory service is down" as well as "a
      # dependency is vulnerable"; the report distinguishes them.
      - name: Dependency audit
        run: |
          set -euo pipefail
          uv export --frozen --group browser --format requirements-txt --no-emit-project \
            | uv run pip-audit --disable-pip --requirement /dev/stdin

      # Lints the workflow files themselves, including this one.
      #
      # Fetched as a version-pinned release binary and checked against its
      # published sha256 rather than run as a third-party action: the reasoning
      # is the same one that pins the actions above by commit SHA, and a
      # checksummed tarball needs no token exposure at all. Bumping the version
      # means bumping the digest with it -- a mismatch fails the step closed.
      #
      # The runner ships shellcheck, so actionlint also lints the `run:` blocks
      # here, matching what .githooks/pre-push reports locally. It exits
      # non-zero on informational findings, so a false positive belongs behind a
      # `# shellcheck disable=...` directive in the workflow that provokes it.
      - name: Workflow lint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar xzf "$archive" actionlint
          ./actionlint

      - name: Corpus lints
        run: uv run python evals/verify_corpus.py

      # One worker per CPU. The flag is here and not in `addopts`, because
      # worker start-up makes a small local run twice as slow.
      - name: Test suite
        env:
          REQUIRE_BROWSER: "1"
        run: uv run --group browser pytest -q -n auto

      # The vendor conformance matrix, rendered into the job summary.
      #
      # Credential-free by construction: every cell comes from the pinned
      # litellm's LOCAL model-cost map, so this covers Vertex, Anthropic and
      # OpenAI equally in a job that holds no key and no cloud identity. That
      # equality is the point -- coverage that only runs where credentials
      # happen to exist is how one vendor ends up better assured than the
      # others, which is what #116 was about.
      #
      # The assertions are in tests/test_conformance.py above; this step only
      # renders, and exits zero whatever the matrix says. An `unsupported` cell
      # is a capability difference, not a failure.
      #
      # always(), so the matrix is still published when the suite above fails --
      # a capability that moved under a dependency bump is frequently the
      # explanation for that failure, and printing it only on success hides it
      # exactly when it is wanted.
      - name: Provider capability matrix
        if: always()
        run: |
          {
            echo "## Provider capability matrix"
            echo
            uv run python -m analysis_service.conformance
          } >>"$GITHUB_STEP_SUMMARY"

      # Says what did NOT run, in the same summary as what did.
      #
      # A green offline check reads as "the providers work" unless something
      # states otherwise, and nothing did: every live lane in this repository
      # reports itself unexercised, because federation is unprovisioned and both
      # API-key secrets are unset. No live lane has ever completed a run against
      # any vendor.
      #
      # This is deliberately a *statement*, not a check that fails. Provisioning
      # was ruled an ops concern, so an unprovisioned repository is a supported
      # state -- but a supported state that is silent is indistinguishable from
      # a validated one, and that is the specific dishonesty #116 asked to
      # remove.
      #
      # The table names the lanes rather than the vendors' state, and that is
      # the honest shape: `provider-smoke.yml` gives every vendor the same
      # lane on the same trigger, so what differs between them is which
      # credentials a repository holds, not how much assurance the project has
      # built for each.
      - name: Report unexercised coverage
        if: always()
        run: |
          {
            echo "## Unexercised coverage"
            echo
            echo "The matrix above is **static capability**, computed from the"
            echo "pinned model map. It is not evidence that any vendor served a"
            echo "request. Each live lane reports that for itself, in its own"
            echo "summary, whether or not it ran."
            echo
            echo "| Lane | Vendors | What it answers | State |"
            echo "| --- | --- | --- | --- |"
            echo "| Offline conformance (this job) | vertex, anthropic, openai, bedrock, gemini, openrouter | what a provider would be asked for | exercised |"
            echo "| Provider smoke | vertex, anthropic, openai, bedrock, gemini, openrouter | does the provider serve this graph | **unexercised** — no credentials configured |"
            echo "| Evals (live Vertex) | vertex | threat-model quality | **unexercised** — federation unprovisioned |"
            echo "| Evals (live API-key vendors) | anthropic, openai | threat-model quality | **unexercised** — dispatch-only, secrets unset |"
            echo "| Evals (any lane) | bedrock | threat-model quality | **unexercised** — no sweep lane; ruled out of scope |"
            echo "| Evals (any lane) | gemini | threat-model quality | **unexercised** — no sweep lane; the vertex sweep already runs these models |"
            echo "| Evals (any lane) | openrouter | threat-model quality | **unexercised** — no sweep lane; a Baseline is not named after an aggregated route |"
            echo
            echo "See [.github/WORKLOAD_IDENTITY.md](.github/WORKLOAD_IDENTITY.md)"
            echo "and [docs/adr/0003-no-privileged-vendor.md](docs/adr/0003-no-privileged-vendor.md)."
          } >>"$GITHUB_STEP_SUMMARY"

  # The PostgreSQL lane: the tests marked `postgres`, against two throwaway
  # servers that live for this job only. The `postgres` server has TLS, and
  # `postgres-plain` has none, so a test can show that the store refuses a
  # server without TLS. Their password is not a secret: each server holds no
  # data, and only this runner can reach it.
  postgres:
    name: PostgreSQL lane
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
        env:
          POSTGRES_PASSWORD: lane
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s
          --health-retries 30
      postgres-plain:
        image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
        env:
          POSTGRES_PASSWORD: lane
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s
          --health-retries 30

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # A service container starts before a step can make a certificate. So
      # this step makes a CA and a certificate for `localhost`, copies them
      # into the server, and turns TLS on with a reload. The tests then use
      # `verify-full` against that CA.
      - name: Turn on TLS
        env:
          CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/postgres"
          mkdir -p "$dir"
          cd "$dir"
          umask 077
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj "/CN=PostgreSQL lane CA" -keyout ca.key -out ca.crt \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign,cRLSign"
          openssl req -newkey rsa:2048 -nodes -subj "/CN=localhost" \
            -keyout server.key -out server.csr
          printf '%s\n' \
            "subjectAltName=DNS:localhost" \
            "basicConstraints=critical,CA:FALSE" \
            "keyUsage=critical,digitalSignature,keyEncipherment" \
            "extendedKeyUsage=serverAuth" \
            "authorityKeyIdentifier=keyid,issuer" >server.ext
          openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key \
            -CAcreateserial -days 1 -extfile server.ext -out server.crt
          printf lane >password
          for file in server.crt server.key; do
            docker cp "$file" "$CONTAINER:/var/lib/postgresql/$file"
          done
          docker exec "$CONTAINER" chown postgres:postgres \
            /var/lib/postgresql/server.crt /var/lib/postgresql/server.key
          docker exec -u postgres "$CONTAINER" psql -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET ssl_cert_file = '/var/lib/postgresql/server.crt'" \
            -c "ALTER SYSTEM SET ssl_key_file = '/var/lib/postgresql/server.key'" \
            -c "ALTER SYSTEM SET ssl = on" \
            -c "SELECT pg_reload_conf()"
          # The reload is asynchronous, so wait until the server reports TLS on.
          for _ in $(seq 30); do
            if [ "$(docker exec -u postgres "$CONTAINER" psql -tAc 'SHOW ssl')" = on ]; then
              exit 0
            fi
            sleep 1
          done
          echo "the server did not turn TLS on" >&2
          exit 1

      # REQUIRE_POSTGRES makes a lane test fail where it would skip. -v lists
      # each lane test, and the last line counts them.
      - name: PostgreSQL lane
        env:
          ANALYSIS_OFFLINE: "1"
          REQUIRE_POSTGRES: "1"
          TEST_POSTGRES_URL: postgresql+asyncpg://postgres@localhost:5432/postgres
          TEST_POSTGRES_PASSWORD_FILE: ${{ runner.temp }}/postgres/password
          TEST_POSTGRES_CA_FILE: ${{ runner.temp }}/postgres/ca.crt
          TEST_POSTGRES_PLAIN_URL: postgresql+asyncpg://postgres@localhost:5433/postgres
        run: uv run pytest -m postgres -v

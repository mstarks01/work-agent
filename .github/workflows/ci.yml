# Offline CI.
#
# Everything here is credential-free by construction: the pytest suite, the
# corpus lints, the prompt/skill lints, and the eval scorer replayed over the
# recorded judge labels in evals/judge_calibration/. No job here may ever be granted
# `id-token: write` — the offline/live split is the security boundary that
# keeps untrusted-PR-shaped work away from the Vertex identity, not a speed
# optimization. Live evals live in evals-live.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default; each job re-grants only what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  offline:
    name: Offline suite (no credentials)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      # Third-party actions are pinned by commit SHA, not tag: a tag is
      # mutable and a moved tag runs attacker code with this job's token.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true

      # --locked fails rather than resolving: CI must install the reviewed
      # uv.lock, not whatever the index offers today.
      - name: Install dependencies
        run: uv sync --locked

      # Ruff's rule selection is its default set, held stable by the exact pin
      # in the uv.lock installed above — see the note in pyproject.toml.
      - name: Lint
        run: uv run ruff check .

      # Markdown is excluded because ruff would reformat the illustrative code
      # fences in docs/ — schema sketches whose aligned trailing comments are
      # prose, not source. The formatter's one source-tree exemption
      # (evals/judge_calibration/build_pairs.py) lives in pyproject.toml.
      - name: Format
        run: uv run ruff format --check . --exclude '*.md'

      # Scope and rule selection are in pyproject.toml's [tool.mypy], so this
      # step and a local `uv run mypy` check exactly the same thing.
      - name: Type check
        run: uv run mypy

      # Audits the locked dependency closure, not the installed environment:
      # `uv export --frozen` fails rather than re-resolving, so the input is the
      # same reviewed uv.lock the install above used, and every hash in it is
      # printed for a human to check against the advisory.
      #
      # Credential-free, like everything else in this job -- the advisory
      # lookup is an anonymous request to PyPI, so the offline/live boundary
      # described in the header is untouched. It does need egress, which is why
      # a failure here can mean "the advisory service is down" as well as "a
      # dependency is vulnerable"; the report distinguishes them.
      - name: Dependency audit
        run: |
          set -euo pipefail
          uv export --frozen --format requirements-txt --no-emit-project \
            | uv run pip-audit --disable-pip --requirement /dev/stdin

      # Lints the workflow files themselves, including this one.
      #
      # Fetched as a version-pinned release binary and checked against its
      # published sha256 rather than run as a third-party action: the reasoning
      # is the same one that pins the actions above by commit SHA, and a
      # checksummed tarball needs no token exposure at all. Bumping the version
      # means bumping the digest with it -- a mismatch fails the step closed.
      #
      # The runner ships shellcheck, so actionlint also lints the `run:` blocks
      # here, matching what .githooks/pre-push reports locally. It exits
      # non-zero on informational findings, so a false positive belongs behind a
      # `# shellcheck disable=...` directive in the workflow that provokes it.
      - name: Workflow lint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar xzf "$archive" actionlint
          ./actionlint

      - name: Corpus lints
        run: uv run python evals/verify_corpus.py

      - name: Test suite
        run: uv run pytest -q

      # The vendor conformance matrix, rendered into the job summary.
      #
      # Credential-free by construction: every cell comes from the pinned
      # litellm's LOCAL model-cost map, so this covers Vertex, Anthropic and
      # OpenAI equally in a job that holds no key and no cloud identity. That
      # equality is the point -- coverage that only runs where credentials
      # happen to exist is how one vendor ends up better assured than the
      # others, which is what #116 was about.
      #
      # The assertions are in tests/test_conformance.py above; this step only
      # renders, and exits zero whatever the matrix says. An `unsupported` cell
      # is a capability difference, not a failure.
      #
      # always(), so the matrix is still published when the suite above fails --
      # a capability that moved under a dependency bump is frequently the
      # explanation for that failure, and printing it only on success hides it
      # exactly when it is wanted.
      - name: Provider capability matrix
        if: always()
        run: |
          {
            echo "## Provider capability matrix"
            echo
            uv run python -m stride_service.conformance
          } >>"$GITHUB_STEP_SUMMARY"

      # Says what did NOT run, in the same summary as what did.
      #
      # A green offline check reads as "the providers work" unless something
      # states otherwise, and nothing did: every live lane in this repository
      # reports itself unexercised, because federation is unprovisioned and both
      # API-key secrets are unset. No live lane has ever completed a run against
      # any vendor.
      #
      # This is deliberately a *statement*, not a check that fails. Provisioning
      # was ruled an ops concern, so an unprovisioned repository is a supported
      # state -- but a supported state that is silent is indistinguishable from
      # a validated one, and that is the specific dishonesty #116 asked to
      # remove.
      #
      # The table names the lanes rather than the vendors' state, and that is
      # the honest shape: `provider-smoke.yml` gives all three vendors the same
      # lane on the same trigger, so what differs between them is which
      # credentials a repository holds, not how much assurance the project has
      # built for each.
      - name: Report unexercised coverage
        if: always()
        run: |
          {
            echo "## Unexercised coverage"
            echo
            echo "The matrix above is **static capability**, computed from the"
            echo "pinned model map. It is not evidence that any vendor served a"
            echo "request. Each live lane reports that for itself, in its own"
            echo "summary, whether or not it ran."
            echo
            echo "| Lane | Vendors | What it answers | State |"
            echo "| --- | --- | --- | --- |"
            echo "| Offline conformance (this job) | vertex, anthropic, openai | what a provider would be asked for | exercised |"
            echo "| Provider smoke | vertex, anthropic, openai | does the provider serve this graph | **unexercised** — no credentials configured |"
            echo "| Evals (live Vertex) | vertex | threat-model quality | **unexercised** — federation unprovisioned |"
            echo "| Evals (live API-key vendors) | anthropic, openai | threat-model quality | **unexercised** — dispatch-only, secrets unset |"
            echo
            echo "See [.github/WORKLOAD_IDENTITY.md](.github/WORKLOAD_IDENTITY.md)"
            echo "and [docs/adr/0003-no-privileged-vendor.md](docs/adr/0003-no-privileged-vendor.md)."
          } >>"$GITHUB_STEP_SUMMARY"

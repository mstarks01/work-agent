# The pairing of each prompt with the code that decides what it says.
#
# This file is the one home of that pairing. Two readers read it and nothing
# else states a pair: `.github/scripts/five_class_read.py` derives the map from
# modules to prompts for the `## Prompt read` check, and
# `tests/test_prompt_outcomes.py` runs each row's check against the code and
# pins each row's sentence in the prompt file. `tests/test_five_class_read.py`
# holds the rows to the tree and to the framework registry, and
# `tests/test_one_reader_lints.py` refuses a pairing written anywhere else.
#
# `[[outcome]]` rows pin one prompt sentence that states what the code does.
#   prompt       the prompt file, relative to the repository root
#   sentence     the whole sentence, as the file spells it; line breaks are
#                read as spaces. A sentence from a CC BY-SA 4.0 file is a short
#                phrase instead (docs/agents/licensing.md).
#   modules      the module paths that decide the outcome, as fnmatch patterns;
#                `{package}` stands for a framework package's directory name
#   check        the name of the function in tests/test_prompt_outcomes.py that
#                runs the code, or
#   wording      the reason no code decides the sentence, so only the pin runs
#   issue_codes  the `validation.IssueCode` values the check produces, where
#                the sentence is the rule against one
#
# `[[reader]]` rows pair a module with the prompts whose outcomes it decides
# where no sentence is pinned yet. A `reason` says what the module decides.
#   module       one module path pattern, as above
#   prompts      the prompt paths, as glob patterns; `*` matches any name
#
# The two kinds never state the same pair. To add a pinned sentence, add an
# `[[outcome]]` row and its check function; to add a module that decides a
# prompt, add a `[[reader]]` row.

# --- Extraction ---------------------------------------------------------------

[[outcome]]
prompt = "prompts/extract.md"
sentence = """Your output is validated mechanically — unique typed IDs, endpoints
that resolve, zone membership, legal enum and asset values."""
modules = ["src/analysis_service/validation.py"]
check = "a_payload_the_schema_refuses_returns_no_model"
issue_codes = ["schema"]

[[outcome]]
prompt = "prompts/extract.md"
sentence = """If it fails, you will see the specific issues and get exactly one
chance to repair them."""
modules = ["src/analysis_service/graph.py"]
check = "a_failed_extraction_gets_one_repair_pass_then_a_rejection"

[[outcome]]
prompt = "prompts/extract.md"
sentence = """**Two things of one type that the text calls by one name are the one
exception**, because they would share an ID and an ID two elements carry names
neither of them."""
modules = ["src/analysis_service/validation.py"]
check = "two_elements_under_one_id_are_refused"
issue_codes = ["duplicate-id"]

[[outcome]]
prompt = "prompts/extract-compact.md"
sentence = """Two elements of the *same* type may not share a ref: that one points
at neither, so every reference to it fails and the whole model goes back for
repair."""
modules = ["src/analysis_service/compact.py"]
check = "a_ref_two_elements_claim_binds_to_neither"
issue_codes = ["duplicate-ref"]

[[outcome]]
prompt = "prompts/extract.md"
sentence = """IDs are recomputed from the names you give in code, so do not
abbreviate one — an ID that differs from its element's name is replaced by the
name's slug, and every reference to it follows automatically."""
modules = ["src/analysis_service/validation.py"]
check = "an_id_that_differs_from_its_name_is_replaced_by_the_slug"
issue_codes = ["id-mismatch"]

[[outcome]]
prompt = "prompts/extract.md"
sentence = """**A `name` needs at least one ASCII letter a-z or digit 0-9**,
because its ID is built from them and drops other letters: where the text names
a thing only in another script, write the name in ASCII letters and put the
text's own spelling in `notes`."""
modules = ["src/analysis_service/validation.py", "src/analysis_service/system_model.py"]
check = "a_name_with_no_ascii_letter_or_digit_has_no_id"
issue_codes = ["empty-slug"]

[[outcome]]
prompt = "prompts/extract.md"
sentence = "Both endpoints must be zoned elements you have already created."
modules = ["src/analysis_service/validation.py"]
check = "a_flow_to_an_element_the_model_lacks_is_refused"
issue_codes = ["invalid-reference"]

[[outcome]]
prompt = "prompts/extract.md"
sentence = """If the text implies no zones at all, create one that covers the
system as described."""
modules = ["src/analysis_service/validation.py"]
check = "a_model_with_no_trust_zone_is_refused"
issue_codes = ["no-trust-zones"]

[[outcome]]
prompt = "prompts/extract.md"
sentence = """**`unknown` is not one of them:** where nothing in the list
applies, leave `assets` empty."""
modules = ["src/analysis_service/validation.py"]
check = "an_unknown_asset_tag_is_dropped_as_no_tag"

[[outcome]]
prompt = "prompts/extract.md"
sentence = """A tag outside the list fails the whole model mechanically and
spends your one repair pass."""
modules = ["src/analysis_service/validation.py"]
check = "a_tag_outside_the_vocabulary_is_refused"
issue_codes = ["illegal-asset-tag"]

[[outcome]]
prompt = "prompts/extract.md"
sentence = """Give every element a `source_excerpt`: a short verbatim quote from
the source it came from, plus the `source_label` naming that source — see rule 7
below."""
modules = ["src/analysis_service/validation.py"]
check = "an_element_with_no_verbatim_excerpt_is_refused"
issue_codes = ["missing-citation", "unverifiable-excerpt"]

[[outcome]]
prompt = "prompts/extract.md"
sentence = "An attribute you left `unknown` inferred nothing and takes no entry."
modules = ["src/analysis_service/validation.py"]
check = "an_assumption_on_an_unknown_attribute_is_refused"
issue_codes = ["assumption-on-unknown"]

[[outcome]]
prompt = "prompts/extract.md"
sentence = "**Never leave a security-relevant attribute empty.**"
modules = ["src/analysis_service/validation.py"]
check = "an_empty_control_is_refused"
issue_codes = ["blank-control"]

[[outcome]]
prompt = "prompts/extract.md"
sentence = """Otherwise name the mechanism first: never open a control with
`no`, `not` or `without`."""
modules = ["src/analysis_service/validation.py"]
check = "a_control_that_opens_with_a_negation_is_refused"
issue_codes = ["ambiguous-control"]

[[outcome]]
prompt = "prompts/extract-compact.md"
sentence = """An omitted attribute, or a flow with no `operations`, is worse: the
schema refuses the whole object, and the job ends with no repair."""
modules = ["src/analysis_service/graph.py", "src/analysis_service/compact.py"]
check = "an_omitted_compact_attribute_ends_the_job_with_no_repair"


# The wording in model text that breaks a wording rule and stays, by ruling.
#
# Model text is text a model reads: the prompts, each framework package's own
# text, the Domain Packs, and the Python strings that reach a model, such as a
# `CapabilityStatement.basis`. A change to it changes model input, so the
# maintainer rules that it changes only with a measured prompt change. Until
# that change lands, the wording is held, and this file is the one record of it.
#
# Three readers read it. `.github/scripts/five_class_read.py` asks a pull
# request that changes a file with a held row to name each held row of that
# file in its `## Prompt read`. The SPEND and MONEY lints in
# `tests/test_history_prose_lints.py` read model text and skip only the held
# rows of their own rule. A review round reads this file and reports no held
# row as a finding (docs/agents/code-review.md). `tests/test_five_class_read.py`
# holds each row to the tree, and `tests/test_one_reader_lints.py` refuses a
# held phrase spelled in any other Python file.
#
# `[[held]]` rows each hold one phrase.
#   file     the file, relative to the repository root
#   phrase   the exact phrase, as the file spells it on one line. A row whose
#            phrase is gone fails, so the row goes in the pull request that
#            lands the measured change.
#   rule     the rule the phrase breaks: a key of `RULES` in five_class_read.py,
#            which states what each rule is
#   reason   why the phrase is held


# Blessed generation-identity fingerprints (wayfinder ticket 08; spec ticket 03
# §4) — the eval gate's baseline. Each LLM graph node maps to the set of
# fingerprints a sanctioned baseline sweep recorded for it. A run whose per-node
# fingerprint (ticket 07: sha256 of the served model + resolved tier sampling)
# is absent from its node's set is *uncertified*: the eval path surfaces that
# verdict and refuses to fold the run into trusted aggregates.
#
# A manifest, not a value derived from sampling.toml, because the served-model
# half of a fingerprint cannot be recomputed from the pinned file. It catches
# override-drift and served-build drift uniformly — both yield fingerprints that
# are simply not in the set. A node keeps a *set* because it may accumulate
# several blessed served-builds over time.
#
# This is written by sweep promotion (`evals.harness.certify.promote`), single-
# sourced with config/sampling.toml so the two cannot drift: the same winning
# SamplingConfig both updates the file and derives the fingerprints recorded
# here. Hand-editing is a review smell — the fingerprints are a machine record.
#
# The sets ship EMPTY: no live sweep has run (out of scope — no Vertex here), so
# no build is blessed yet, and every real run reads as uncertified until a
# baseline sweep promotes one. That is the honest pre-baseline state, and it
# mirrors run.py's rule that a gate firing before the normal range is known just
# trains people to bypass it — hard-fail is a CI knob (`--require-certified`),
# off by default.

version = 1

[nodes]
extract = []
repair = []
critic = []
recritic = []
analyst_spoofing = []
analyst_tampering = []
analyst_repudiation = []
analyst_information_disclosure = []
analyst_denial_of_service = []
analyst_elevation_of_privilege = []

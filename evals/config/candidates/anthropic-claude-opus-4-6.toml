# Judge candidate: Anthropic's strong-tier reference, measured against the
# recorded labels in evals/judge_calibration/pairs.json.
#
# It is a candidate, not a selection. Selecting a judge is a reviewed commit to
# evals/config/judge.toml with a version bump, because a judge change re-scores
# every historical number.
#
# claude-opus-4-6 is the newest Claude the greedy-decoding requirement admits:
# Claude 4.7 and later reject `temperature`, so a newer name would need this
# file to unset the line and stop being a like-for-like comparison.
#
# order_seed matches evals/config/judge.toml, so every candidate meets each
# pair in the same presentation order and the comparison isolates the model.

version = 3
vendor = "anthropic"
model = "claude-opus-4-6"
temperature = 0.0
order_seed = 20260721

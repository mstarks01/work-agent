# Judge candidate: OpenAI, measured against the recorded labels in
# evals/judge_calibration/pairs.json.
#
# It is a candidate, not a selection. Selecting a judge is a reviewed commit to
# evals/config/judge.toml with a version bump, because a judge change re-scores
# every historical number.
#
# gpt-4o and not the strong reference gpt-5.6: the judge requires greedy
# decoding, and the OpenAI API rejects `temperature` on gpt-5.6 with "Only the
# default (1) value is supported". So this comparison runs OpenAI's base
# reference against the other vendors' strong ones, and reads accordingly.
#
# order_seed matches evals/config/judge.toml, so every candidate meets each
# pair in the same presentation order and the comparison isolates the model.

version = 3
vendor = "openai"
model = "gpt-4o"
temperature = 0.0
order_seed = 20260721

# The eval judge (wayfinder ticket 009, decision 12) — pinned and versioned
# SEPARATELY from config/model_tiers.toml, and deliberately with no env-var
# override.
#
# A judge upgrade silently re-scores every historical number and turns a
# comparison into a phantom regression, so changing anything in this file is a
# re-baselining event, not a dependency bump: bump `version`, re-run the
# judge-vs-human agreement check over evals/judge_calibration/pairs.json
# (>= 90%, ticket 009 decision 13), and re-baseline the tracked metrics.
#
# The judge names a (vendor, model) pair like any tier, and nothing here is
# Google-only: the pair below is one selection among three vendors, not a
# platform assumption. Judge and subject may therefore differ in vendor, which
# is what removed the old defence against self-preference bias — that the two
# always shared one. What stands in its place is measured: agreement against
# the hand labels in evals/judge_calibration/pairs.json (>= 90%), which is
# vendor-independent ground truth. That the judge rules on claim *equivalence*
# — a near-symmetric relation rather than a quality preference, which is where
# self-enhancement bias bites — bounds the exposure, but it no longer
# substitutes for the measurement.
#
# temperature is pinned with the judge rather than read from
# config/sampling.toml: that file is the configuration under test, and a judge
# whose decoding moved with it would re-score history every time the suite
# measured a new production temperature.
#
# order_seed seeds the presentation-order shuffle that kills position bias, so
# a scoring run is reproducible while order stays uncorrelated with which side
# of a pair is the reference.

# Version 2 (ticket 026) corrected the model string only: "gemini-2.5-pro-002"
# was a Gemini 1.5-era naming convention that does not resolve on Vertex, so
# this judge had never been able to run. Nothing is re-baselined by the change
# because no baseline exists — the >= 90% agreement check has still never
# executed.

# Version 3 (wayfinder #10 / #15) joins the multi-vendor cutover. The judge now
# names a (vendor, model) pair like any tier, because it is no longer Google-
# only: its legitimacy rests on measured agreement against the hand labels in
# evals/judge_calibration/pairs.json (>= 90%), which is vendor-independent
# ground truth, plus a greedy-decoding requirement so a re-run cannot flip a
# verdict. This is what reopened the self-preference question recorded at the
# top of this file: the assumption that judge and subject always share a vendor
# is gone, and the agreement check is what replaces it.
#
# The loader runs the build-time sampling gate over (vendor, model,
# temperature), which is how "o-series cannot judge" fails closed: greedy
# decoding is required here, and o-series constrains temperature to exactly 1,
# so an o-series judge is a load-time error rather than a surprise mid-sweep.
#
# The pair below is unchanged in behaviour from version 2 — the same Gemini
# model, now named with the vendor that was previously implicit.

version = 3
vendor = "vertex"
model = "gemini-2.5-pro"
temperature = 0.0
order_seed = 20260721

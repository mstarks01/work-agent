# The eval judge (wayfinder ticket 009, decision 12) — pinned and versioned
# SEPARATELY from config/model_tiers.toml, and deliberately with no env-var
# override.
#
# A judge upgrade silently re-scores every historical number and turns a
# comparison into a phantom regression, so changing anything in this file is a
# re-baselining event, not a dependency bump: bump `version`, re-run the
# judge-vs-label agreement check over evals/judge_calibration/pairs.json
# (>= 90%, ticket 009 decision 13), and re-baseline the tracked metrics.
#
# The judge names a (vendor, model) pair like any tier, and nothing here is
# Google-only: the pair below is one selection among three vendors, not a
# platform assumption. Judge and subject may therefore differ in vendor, which
# is what removed the old defence against self-preference bias — that the two
# always shared one. What is meant to stand in its place is agreement against
# the recorded labels in evals/judge_calibration/pairs.json (>= 90%), which are
# vendor-independent but agent-authored, so they are a fixed reference and not
# ground truth. THAT CHECK HAS NEVER RUN, so nothing stands in its place today:
# the judge below shares a vendor with one of the tiers it may be asked to
# grade, and no number says what that costs. That the judge rules on claim
# *equivalence* — a near-symmetric relation rather than a quality preference,
# which is where self-enhancement bias bites — bounds the exposure, and it is
# the only thing that does.
#
# temperature is pinned with the judge rather than read from
# config/sampling.toml: that file is the configuration under test, and a judge
# whose decoding moved with it would re-score history every time the suite
# measured a new production temperature.
#
# order_seed seeds the presentation-order shuffle that kills position bias. It
# makes the SHUFFLE reproducible — the same pair meets the same order on every
# run — while order stays uncorrelated with which side of a pair is the
# reference. It does not make the run reproducible: the rulings come from a
# provider whose batching is not under this file's control.

# Version 2 (ticket 026) corrected the model string only: "gemini-2.5-pro-002"
# was a Gemini 1.5-era naming convention that does not resolve on Vertex, so
# this judge had never been able to run. Nothing is re-baselined by the change
# because no baseline exists — the >= 90% agreement check has still never
# executed.

# Version 3 (wayfinder #10 / #15) joins the multi-vendor cutover. The judge now
# names a (vendor, model) pair like any tier, because it is no longer Google-
# only: its legitimacy would rest on measured agreement against the recorded
# labels in evals/judge_calibration/pairs.json (>= 90%) — vendor-independent, and
# agent-authored rather than ground truth. That measurement has never run, so the
# legitimacy is claimed and not held. Plus a greedy-decoding requirement, which
# constrains which models may judge without making a re-run reproducible: it
# removes sampling variance and not the batch effects underneath it, so a
# re-run can still flip a verdict. Nothing here measures how often it does;
# `calibrate` calls each pair once. This is what reopened the self-preference
# question recorded at the top of this file: the assumption that judge and
# subject always share a vendor is gone, and the agreement check that would
# replace it has not been run.
#
# The loader runs the build-time sampling gate over (vendor, model,
# temperature), which is how "o-series cannot judge" fails closed: greedy
# decoding is required here, and o-series constrains temperature to exactly 1,
# so an o-series judge is a load-time error rather than a surprise mid-sweep.
#
# The pair below is unchanged in behaviour from version 2 — the same Gemini
# model, now named with the vendor that was previously implicit.

version = 3
vendor = "vertex"
model = "gemini-2.5-pro"
temperature = 0.0
order_seed = 20260721
